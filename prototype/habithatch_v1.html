<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0C4C60">
<title>HabitHatch</title>
<style>
:root{
  --teal:#0C4C60; --teal-2:#12667F; --teal-ink:#0B2530;
  --orange:#E28A4B; --orange-2:#C9773A;
  --yellow:#FFDA7C; --yellow-2:#F4B942;
  --coin-ink:#1E4B5F; --ink:#2D2F41; --muted:#8B897E;
  --cream:#FBF6EC; --card:#FFFFFF; --line:#EFE6D6; --line-2:#E4D8C2;
  --grass:#A7C34F; --sky:#BFE3F3; --room-bg:#A0B559; --floor:#DCC79A;
  --good:#1E7F91; --danger:#E5654B; --pink:#E68FB0;
  --tint:#FFF7EF;   /* the selected-chip wash, themed with the accent */
  --tint-2:var(--tint-2); /* the cool wash that pairs with --good */
  --glow:rgba(226,138,75,.5);  /* the accent drop shadow */
  --shadow:0 10px 16px rgba(12,76,96,.10);
  --shadow-sm:0 4px 12px rgba(12,76,96,.08);
  --r-sm:12px; --r-md:16px; --r-lg:20px; --r-pill:999px;
  --nav-h:74px;
}

/* ---- HabitHatch+ themes. Each one only moves the accent family, so the
   paper, cards and artwork stay exactly as drawn. ---- */
:root[data-theme="dusk"]{
  --teal:#3E2E5E; --teal-2:#5A4487; --teal-ink:#241A38; --coin-ink:#3E2E5E;
  --orange:#D9628F; --orange-2:#BC4E78; --tint:#FDF0F5;
  --good:#7A5FA8; --sky:#DCD2EF;
  --tint-2:#EDE7F6; --glow:rgba(217,98,143,.5);
  --shadow:0 10px 16px rgba(62,46,94,.12); --shadow-sm:0 4px 12px rgba(62,46,94,.09);
}
:root[data-theme="forest"]{
  --teal:#1E4632; --teal-2:#2F6B49; --teal-ink:#132A1F; --coin-ink:#1E4632;
  --orange:#D19A2E; --orange-2:#B07F1E; --tint:#FBF4E3;
  --good:#3F7D4E; --sky:#CFE4D2;
  --tint-2:#E3EFE4; --glow:rgba(209,154,46,.5);
  --shadow:0 10px 16px rgba(30,70,50,.12); --shadow-sm:0 4px 12px rgba(30,70,50,.09);
}
:root[data-theme="ocean"]{
  --teal:#123A5C; --teal-2:#1D5A82; --teal-ink:#0B2135; --coin-ink:#123A5C;
  --orange:#2FA0AE; --orange-2:#238795; --tint:#E9F6F7;
  --good:#2E8FA8; --sky:#CDE9F3;
  --tint-2:#E1F0F3; --glow:rgba(47,160,174,.5);
  --shadow:0 10px 16px rgba(18,58,92,.12); --shadow-sm:0 4px 12px rgba(18,58,92,.09);
}
:root[data-theme="ember"]{
  --teal:#4A2A20; --teal-2:#6E4032; --teal-ink:#2C1710; --coin-ink:#4A2A20;
  --orange:#DE5B39; --orange-2:#BE452A; --tint:#FDEFEA;
  --good:#A8623F; --sky:#F1D9CC;
  --tint-2:#F5E5DC; --glow:rgba(222,91,57,.5);
  --shadow:0 10px 16px rgba(74,42,32,.12); --shadow-sm:0 4px 12px rgba(74,42,32,.09);
}

/* appearance picker */
.themegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.themecard{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 4px 8px;
  border-radius:var(--r-sm);background:#fff;border:1.5px solid var(--line-2);transition:.14s;}
.themecard.on{border-color:var(--orange);background:var(--tint);}
.themecard:active{transform:scale(.97);}
.themesw{width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(0,0,0,.07);position:relative;overflow:hidden;}
.themesw i{position:absolute;inset:0;}
.themesw i:last-child{clip-path:polygon(100% 0,100% 100%,0 100%);}
.themenm{font-size:10px;font-weight:800;color:var(--teal-ink);letter-spacing:.1px;}
.themecard.tlock .themesw,.themecard.tlock .themenm{opacity:.45;}
/* free vs plus table */
.cmp{padding:2px 14px;}
.cmprow{display:grid;grid-template-columns:1fr 76px 82px;align-items:center;gap:6px;
  padding:10px 0;border-bottom:1px solid var(--line);}
.cmprow span{font-size:11.5px;font-weight:700;color:var(--teal-ink);text-align:center;}
.cmpk{text-align:left!important;color:var(--ink)!important;}
.cmpf{color:var(--muted)!important;}
.cmphead span{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)!important;}
.cmphead .cplus{display:inline-flex;align-items:center;justify-content:center;gap:4px;color:#7A4B00!important;
  background:var(--yellow);border-radius:var(--r-pill);padding:3px 0;}
.cmpp{color:var(--orange-2)!important;font-weight:800;}
.cyes{display:inline-flex;color:var(--good);}
.cno{display:inline-flex;color:#CFC6B4;}

.themelk{position:absolute;top:5px;right:5px;width:15px;height:15px;border-radius:50%;background:var(--yellow);
  color:#7A4B00;display:flex;align-items:center;justify-content:center;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Poppins','Segoe UI',Roboto,system-ui,-apple-system,sans-serif;
  background:#0b3543; color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;min-height:100dvh;overflow:hidden;
}
body::before{content:"";position:fixed;inset:0;
  background:
   radial-gradient(1100px 600px at 20% -10%, #14586e 0%, transparent 60%),
   radial-gradient(900px 700px at 100% 110%, #0e4256 0%, transparent 55%),
   #0b3543;
  z-index:-1;}

/* A phone does not show a scroll track. Every scrollable surface inside the
   frame scrolls silently, the way a native list does. */
#device, #device *{scrollbar-width:none;-ms-overflow-style:none;}
#device ::-webkit-scrollbar,
#device::-webkit-scrollbar{width:0;height:0;background:transparent;}

/* ===== device frame ===== */
#device{
  position:relative;width:100vw;height:100vh;height:100dvh;max-width:440px;max-height:940px;
  background:var(--cream);overflow:hidden;display:flex;flex-direction:column;
}
@media(min-width:480px){
  #device{border-radius:40px;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 11px #10151b,0 0 0 13px #232c33;}
}

/* ===== screen stack ===== */
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;background:var(--cream);}
.screen.active{display:flex;}
.screen.overlay{z-index:40;}
.fade-in{animation:fade .28s ease both;}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.slide-up{animation:slideup .32s cubic-bezier(.2,.8,.2,1) both;}
.slide-down{animation:slidedown .26s cubic-bezier(.4,0,.9,.5) both;}
.fade-out{animation:fadeout .2s both;}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
@keyframes slidedown{from{transform:none}to{transform:translateY(100%)}}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
.pad{padding:16px 16px calc(var(--nav-h) + 20px);}
.pad-flat{padding:16px 16px 26px;}

/* ===== generic ===== */
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
img{display:block;}
input,textarea,select{font-family:inherit;}
.row{display:flex;align-items:center;}
.spread{justify-content:space-between;}
.gap4{gap:4px}.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}
.center{align-items:center;justify-content:center;}
.hide{display:none!important;}
.muted{color:var(--muted);}
h1,h2,h3,h4{margin:0;font-weight:700;color:var(--teal-ink);}

.coinpill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line-2);
  padding:6px 12px 6px 7px;border-radius:var(--r-pill);font-weight:700;color:var(--coin-ink);box-shadow:var(--shadow-sm);}
.coinpill img{width:22px;height:22px}
.coinpill.bump{animation:bump .5s ease;}
@keyframes bump{0%,100%{transform:none}30%{transform:scale(1.16)}}
.coinmini{width:16px;height:16px;vertical-align:-3px;margin-right:5px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--orange);color:#fff;font-weight:700;border-radius:var(--r-md);padding:14px 18px;
  box-shadow:0 6px 0 var(--orange-2);transition:transform .06s, box-shadow .06s;font-size:15px;}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--orange-2);}
.btn.teal{background:var(--teal);box-shadow:0 6px 0 #072f3d;}
.btn.teal:active{box-shadow:0 2px 0 #072f3d;}
.btn.ghost{background:#fff;color:var(--teal);box-shadow:0 0 0 1.5px var(--line-2) inset;font-weight:600;}
.btn.ghost:active{transform:translateY(2px);}
.btn.block{display:flex;width:100%;}
.btn.sm{padding:9px 14px;border-radius:var(--r-sm);font-size:13px;box-shadow:0 4px 0 var(--orange-2);}
.btn.sm:active{box-shadow:0 1px 0 var(--orange-2);}
.btn[disabled]{opacity:.5;box-shadow:none;pointer-events:none;filter:saturate(.6);}

.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);border:1px solid var(--line);}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:4px 9px;border-radius:var(--r-pill);background:var(--cream);color:var(--teal);border:1px solid var(--line-2);}
.chip.good{color:var(--good);background:var(--tint-2);border-color:#CFE2E8;}
.chip.warn{color:var(--orange-2);background:#FFF4E7;border-color:#F6DFC4;}

.ic{display:inline-block;vertical-align:middle;flex:none;}
.ic.stroke{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.ic.fill{fill:currentColor;stroke:none;}
.ic.pink{color:var(--pink);}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px 3px 8px;
  border-radius:var(--r-pill);letter-spacing:.2px;background:var(--cream);color:#5C6B72;border:1px solid var(--line-2);}
.metaic{color:#9A968A;}

.moodpill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;color:var(--teal-ink);}
.mooddot{width:8px;height:8px;border-radius:50%;flex:none;}
.mooddot.happy{background:#1E7F91}.mooddot.content{background:#E9B24C}.mooddot.tired{background:#C79350}.mooddot.hungry{background:#D98C6A}
.bonuspill{display:inline-flex;align-items:center;gap:6px;background:#FFF4E7;border:1px solid #F6DFC4;color:var(--orange-2);
  font-weight:800;font-size:12px;padding:5px 11px 5px 9px;border-radius:var(--r-pill);}
.bonuspill .ic{color:var(--orange);}

/* ===== top bar ===== */
.topbar{padding:max(20px, calc(12px + env(safe-area-inset-top))) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.hello .k{font-size:12px;color:var(--muted);font-weight:600;line-height:1;}
.hello .n{font-size:20px;font-weight:800;color:var(--teal-ink);line-height:1.15;}
.hi-av{flex:none;}
.hi-av img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2.5px solid #fff;background:#DDEDE9;box-shadow:var(--shadow-sm);}
.hi-av:active{transform:scale(.94);}
.flamepill{display:inline-flex;align-items:center;gap:3px;background:#FFF4E7;border:1px solid #F6DFC4;color:var(--orange-2);
  font-weight:800;font-size:12.5px;padding:5px 11px 5px 6px;border-radius:var(--r-pill);}
.flamepill svg{width:19px;height:19px;flex:none;}

/* ===== bottom nav ===== */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;
  box-shadow:0 -6px 20px rgba(12,76,96,.06);}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;}
.tabbar button[data-tab]::before{content:'';position:absolute;top:50%;left:50%;width:62px;height:50px;border-radius:var(--r-md);background:var(--tint-2);opacity:0;transform:translate(-50%,-50%) scale(.82);transition:opacity .22s ease, transform .22s ease;z-index:0;}
.tabbar button.on::before{opacity:1;transform:translate(-50%,-50%) scale(1);}
.tabbar .ni{display:flex;align-items:center;justify-content:center;position:relative;z-index:1;color:var(--muted);opacity:.5;transition:opacity .2s ease,color .2s ease;}
.tabbar .ni svg{width:24px;height:24px;}
.tabbar .lbl{font-size:10.5px;font-weight:700;color:var(--muted);transition:color .2s ease;position:relative;z-index:1;}
.tabbar button.on .ni{opacity:1;color:var(--teal);}
.tabbar button.on .lbl{color:var(--teal);}
.tabbar .capbtn{flex:none;width:62px;height:62px;border-radius:50%;background:var(--orange);border:5px solid var(--card);
  transform:translateY(-18px);box-sizing:border-box;
  box-shadow:0 10px 22px var(--glow),0 5px 0 var(--orange-2);display:flex;align-items:center;justify-content:center;}
.tabbar .capbtn:active{transform:translateY(-14px);box-shadow:0 6px 14px var(--glow),0 2px 0 var(--orange-2);}
.tabbar .capbtn svg{width:28px;height:28px;stroke:#fff;stroke-width:3;fill:none;}

/* ===== splash ===== */
#splash{background:linear-gradient(180deg,#0C4C60,#0a3d4e);align-items:center;justify-content:center;}
#splash .glow{position:absolute;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,218,124,.42) 0%, rgba(255,218,124,0) 68%);
  animation:pulse 3s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.4}50%{transform:scale(1.05);opacity:.65}}
#splash .logo{width:126px;z-index:2;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both;}
#splash .logo svg{width:126px;height:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.28));}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
#splash .word{margin-top:18px;color:#fff;font-weight:800;font-size:30px;letter-spacing:.5px;z-index:2;}
#splash .stag{color:#BFE3F3;font-weight:600;margin-top:2px;z-index:2;font-size:13.5px;}
#splash .quote{position:absolute;bottom:104px;left:30px;right:30px;text-align:center;color:#8FC0CC;
  font-size:13.5px;font-weight:600;line-height:1.55;z-index:2;animation:qin .8s ease .3s both;}
@keyframes qin{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.loader{position:absolute;bottom:70px;width:120px;height:5px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden;}
.loader i{position:absolute;left:-40%;width:40%;height:100%;background:var(--orange);border-radius:9px;animation:load 1.2s ease-in-out infinite;}
@keyframes load{to{left:110%}}

/* ===== onboarding ===== */
.ob{flex:1;display:flex;flex-direction:column;padding:26px 22px calc(env(safe-area-inset-bottom) + 22px);overflow-y:auto;}
.ob-mid{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;}
.ob .dots{display:flex;gap:7px;justify-content:center;margin-bottom:14px;flex:none;}
.ob .dots i{width:8px;height:8px;border-radius:9px;background:var(--line-2);transition:.2s;}
.ob .dots i.on{width:22px;background:var(--orange);}
.ob h2{font-size:24px;line-height:1.25;margin-bottom:8px;}
.ob p.sub{color:var(--muted);font-size:14.5px;line-height:1.5;margin:0 0 18px;}
.ob-hero{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:120px;}
.field{width:100%;background:#fff;border:2px solid var(--line);border-radius:var(--r-md);padding:15px 16px;
  font-size:16px;color:var(--ink);font-weight:600;outline:none;transition:.15s;}
.field:focus{border-color:var(--orange);}
.field::placeholder{color:#BDB8AB;font-weight:500;}
.label{font-size:12.5px;font-weight:700;color:var(--teal);margin:0 0 7px 4px;}
.obfoot{flex:none;margin-top:14px;display:flex;gap:10px;}

/* category picker grid */
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.catopt{background:#fff;border:2px solid var(--line);border-radius:var(--r-md);padding:11px 6px 9px;
  display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--shadow-sm);transition:.14s;position:relative;}
.catopt svg{width:36px;height:36px;}
.catopt .cl{font-size:11px;font-weight:700;color:var(--teal-ink);line-height:1.2;text-align:center;}
.catopt.on{border-color:var(--orange);background:var(--tint);}
.catopt.on::after{content:'';position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--orange);
  box-shadow:0 3px 8px var(--glow);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23fff' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12.5 10 17.5 19 7'/></svg>");
  background-size:15px;background-position:center;background-repeat:no-repeat;}
.catopt:active{transform:scale(.96);}
.pickcount{font-size:12.5px;font-weight:700;color:var(--muted);text-align:center;margin-top:12px;}

/* species carousel */
.speclist{display:flex;gap:11px;overflow-x:auto;padding:4px 22px 10px;margin:0 -22px;scroll-snap-type:x mandatory;}
.speclist::-webkit-scrollbar{display:none}
.speccard{flex:none;width:132px;scroll-snap-align:center;background:#fff;border:2px solid var(--line);border-radius:var(--r-lg);
  padding:12px 10px 13px;text-align:center;box-shadow:var(--shadow-sm);transition:.15s;position:relative;}
.speccard.sel{border-color:var(--orange);background:var(--tint);}
.speccard .sart{height:106px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:6px;}
.speccard .sart svg{height:106px;width:auto;}
.speccard .sart img{height:96px;width:auto;object-fit:contain;mix-blend-mode:multiply;}
.speccard .snm{font-weight:800;font-size:14.5px;color:var(--teal-ink);}
.speccard .smeta{font-size:11px;color:var(--muted);font-weight:600;line-height:1.35;margin-top:2px;min-height:29px;}
.speccard .sbadge{position:absolute;top:8px;right:8px;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:var(--r-pill);}
.speccard .sbadge.free{background:var(--tint-2);color:var(--good);}
.speccard .sbadge.prem{background:var(--yellow);color:#7A4B00;}

/* ===== universal inline-SVG fitter ===== */
.fit{display:flex;align-items:flex-end;justify-content:center;}
.fit>svg{height:100%;width:auto;display:block;}
.fit>img{height:100%;width:auto;object-fit:contain;display:block;}
.avwrap{display:inline-flex;border-radius:50%;overflow:hidden;border:2.5px solid #fff;background:#DDEDE9;
  box-shadow:var(--shadow-sm);flex:none;align-items:flex-end;justify-content:center;}
.avwrap .avin{display:flex;align-items:flex-end;height:122%;}
.avwrap svg,.avwrap img{height:100%;width:auto;display:block;}

/* ===== room / companion stage ===== */
.room{position:relative;height:270px;overflow:hidden;background:var(--room-bg);}
.roomart{position:absolute;inset:0;width:100%;height:100%;}
.room::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,transparent 74%,rgba(251,246,236,.35) 90%,var(--cream) 100%);}
.petstage{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:center;z-index:2;padding-bottom:44px;}
.petwrap{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;}
.petart{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;
  filter:drop-shadow(0 12px 10px rgba(0,0,0,.14));animation:breathe 3.4s ease-in-out infinite;transform-origin:50% 100%;}
.petart>svg{display:block;height:100%;width:auto;}
.petart>img{display:block;height:100%;width:auto;object-fit:contain;}
@keyframes breathe{0%,100%{transform:translateY(0) scaleY(1) scaleX(1)}50%{transform:translateY(-5px) scaleY(1.028) scaleX(.988)}}
.petart.happy{animation-duration:2.6s}
.petart.tired{animation-duration:4.4s}
.petart.hungry{animation-duration:5s;filter:drop-shadow(0 12px 10px rgba(0,0,0,.14)) saturate(.78);}
.petart.cheer{animation:cheer .8s cubic-bezier(.2,1.4,.4,1) 2;}
@keyframes cheer{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-16px) rotate(-5deg)}60%{transform:translateY(-4px) rotate(4deg)}}
.petart>img.petoutfit{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none;z-index:3;
  height:auto;object-fit:fill;filter:drop-shadow(0 2px 2px rgba(0,0,0,.16));}
.petshadow{position:absolute;bottom:48px;left:50%;transform:translateX(-50%);width:118px;height:20px;border-radius:50%;background:rgba(0,0,0,.16);filter:blur(5px);z-index:1;}
.moodtag{position:absolute;top:12px;left:12px;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(4px);
  padding:6px 12px;border-radius:var(--r-pill);font-weight:700;font-size:12.5px;color:var(--teal-ink);box-shadow:var(--shadow-sm);display:flex;gap:6px;align-items:center;}
.stagetag{position:absolute;top:12px;right:12px;z-index:5;background:rgba(12,76,96,.9);color:#fff;
  padding:5px 11px;border-radius:var(--r-pill);font-weight:800;font-size:11px;letter-spacing:.2px;display:flex;gap:5px;align-items:center;}

/* idle coin pile */
.coinpile{position:absolute;inset:0;z-index:6;border:none;background:transparent;padding:0;cursor:pointer;}
.pilecoin{position:absolute;}
.pilecoin img{display:block;filter:drop-shadow(0 3px 3px rgba(0,0,0,.22));animation:coinpop .42s ease-out backwards, coinbob 2.6s ease-in-out infinite;}
@keyframes coinpop{from{opacity:0;transform:translateY(10px) scale(.5)}}
@keyframes coinbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.pilebadge{position:absolute;top:52px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:5px;background:rgba(12,76,96,.92);color:#fff;font-weight:800;font-size:11.5px;padding:5px 11px;border-radius:var(--r-pill);box-shadow:var(--shadow-sm);white-space:nowrap;}
.pilebadge img{width:15px;height:15px;}

/* egg in room */
.eggstage{position:absolute;left:0;right:0;bottom:0;height:200px;display:flex;align-items:flex-end;justify-content:center;z-index:2;padding-bottom:38px;}
.eggart{height:168px;animation:eggwobble 2.8s ease-in-out infinite;transform-origin:50% 92%;filter:drop-shadow(0 10px 8px rgba(0,0,0,.16));}
.eggart svg{height:100%;width:auto;display:block;}
@keyframes eggwobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-3.5deg)}40%{transform:rotate(3deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(1.4deg)}}
.eggart.ready{animation-duration:.9s;}

/* health */
.health{display:flex;align-items:center;gap:9px;}
.health .bar{flex:1;height:13px;border-radius:9px;background:#EFE7D6;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.06);}
.health .fill{height:100%;border-radius:9px;background:linear-gradient(90deg,var(--yellow-2),var(--yellow));transition:width .5s cubic-bezier(.2,.8,.2,1);}
.health.low .fill{background:linear-gradient(90deg,#E5654B,#F09A6E);}
.health .heart{display:flex;color:#E5654B;}
.hval{font-weight:800;color:var(--teal-ink);font-size:13px;min-width:52px;text-align:right;}

/* stat tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.tile{background:#fff;border-radius:var(--r-md);padding:12px 10px;text-align:center;box-shadow:var(--shadow-sm);border:1px solid var(--line);}
.tile .v{font-size:20px;font-weight:800;color:var(--teal-ink);line-height:1;}
.tile .l{font-size:10.5px;font-weight:700;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.3px;}
.tile .tileic{margin-bottom:5px;display:flex;justify-content:center;color:var(--teal);}

.shead{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px;}
.shead h3{font-size:16px;}
.shead .see{font-size:12.5px;font-weight:700;color:var(--orange);}

/* ===== habit rows ===== */
.habit{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:18px;background:#fff;
  box-shadow:var(--shadow-sm);border:1px solid var(--line);margin-bottom:10px;transition:.14s;position:relative;overflow:hidden;}
.habit:active{transform:scale(.99);}
.habit.done{background:#F7FAF9;border-color:#E1EDEF;}
.habit.done .h-name{color:#5D7B84;}
.habit .h-ic{width:42px;height:42px;border-radius:14px;background:var(--cream);border:1px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;flex:none;}
.habit .h-ic svg{width:28px;height:28px;}
.h-main{flex:1;min-width:0;}
.h-name{font-weight:700;font-size:14.5px;color:var(--teal-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.h-sub{display:flex;align-items:center;gap:7px;margin-top:4px;flex-wrap:wrap;}
.h-meta{font-size:11.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:3px;}
.hflame{display:inline-flex;align-items:center;gap:2px;font-size:11.5px;font-weight:800;color:var(--orange-2);}
.hflame svg{width:15px;height:15px;flex:none;}
.hflame.cold{color:#B9B4A6;filter:saturate(.15);}
/* the big tappable habit control */
.hbox{width:48px;height:48px;flex:none;position:relative;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .12s;}
.hbox svg{width:48px;height:48px;display:block;}
.hbox:active{transform:scale(.9);}
.hbox.pop{animation:hpop .45s cubic-bezier(.2,1.5,.4,1);}
@keyframes hpop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.hbox .hring-prog{transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1);}

/* weekly dots */
.wdots{display:flex;gap:4px;margin-top:6px;}
.wdots i{width:15px;height:15px;border-radius:50%;background:var(--cream);border:1.5px solid var(--line-2);display:flex;align-items:center;justify-content:center;}
.wdots i.on{background:var(--good);border-color:var(--good);}
.wdots i.miss{background:#FBE6E0;border-color:#F0C7BC;}
.wdots i.na{opacity:.4;}
.wdots i.today{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--orange);}
.wdots span{font-size:8px;font-weight:800;color:#fff;line-height:1;}

/* today hero card */
.dayring{display:flex;align-items:center;gap:15px;padding:15px 16px;}
.dayringwrap{position:relative;flex:none;line-height:0;}
.dayctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.dayctr b{font-size:21px;font-weight:800;color:var(--teal-ink);line-height:1;letter-spacing:.2px;}
.dayctr span{font-size:10px;font-weight:700;color:var(--muted);margin-top:5px;letter-spacing:.3px;}
.dayinfo{flex:1;min-width:0;}
.dayh{font-weight:800;color:var(--teal-ink);font-size:15px;}
.daysub{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px;line-height:1.4;}
.daychips{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;}
.gchip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--teal);background:var(--cream);
  border:1px solid var(--line-2);padding:4px 9px;border-radius:var(--r-pill);}
.gchip svg{color:var(--orange);}

/* hatch progress banner */
.eggbanner{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#0C4C60,#12667F);border-radius:var(--r-lg);
  padding:14px 15px;box-shadow:var(--shadow);color:#fff;margin-top:-26px;position:relative;z-index:6;width:100%;text-align:left;}
.eggbanner:active{transform:scale(.99);}
.eggbanner .eb-ic{width:42px;height:42px;flex:none;display:flex;align-items:center;justify-content:center;}
.eggbanner .eb-ic svg{width:34px;height:auto;}
.eggbanner .eb-h{font-weight:800;font-size:14.5px;line-height:1.2;}
.eggbanner .eb-s{font-size:11.5px;color:#BFE3F3;margin-top:3px;line-height:1.4;}
.eggsegs{display:flex;gap:5px;margin-top:8px;}
.eggsegs i{flex:1;height:7px;border-radius:9px;background:rgba(255,255,255,.2);}
.eggsegs i.on{background:var(--yellow);}
.eggbanner .chev{margin-left:auto;color:#BFE3F3;flex:none;}

/* garden strip on home */
.jstrip{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
  border-radius:18px;padding:13px 14px;box-shadow:var(--shadow-sm);margin-top:14px;}
.jstrip:active{transform:scale(.99);}
.jstrip-ic{width:36px;height:36px;border-radius:12px;background:#EDF3E4;color:#6E8C31;display:flex;align-items:center;justify-content:center;flex:none;}
.jstrip-main{flex:1;min-width:0;}
.jstrip-h{display:block;font-weight:700;font-size:13.5px;color:var(--teal-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.jprogbar{height:8px;border-radius:9px;background:#EFE7D6;overflow:hidden;display:block;}
.jstrip-bar{margin-top:7px;}
.jprogfill{height:100%;border-radius:9px;background:linear-gradient(90deg,var(--grass),#C2DA75);display:block;transition:width .5s;}
.chev{color:var(--line-2);display:flex;flex:none;}

.carerow{display:flex;gap:10px;margin-top:14px;}
.carebtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border-radius:var(--r-md);background:#fff;box-shadow:var(--shadow-sm);border:1px solid var(--line);}
.carebtn:active{transform:scale(.97);}
.carebtn .cic{width:34px;height:34px;object-fit:contain;}
.carebtn .clbl{font-size:11.5px;font-weight:700;color:var(--teal-ink);}

.benrow{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line);}
.benic{width:40px;height:40px;border-radius:13px;background:var(--cream);display:flex;align-items:center;justify-content:center;flex:none;}
.benmain{flex:1;min-width:0;}
.bent{font-weight:700;font-size:14px;color:var(--teal-ink);}
.bend{font-size:11.5px;color:var(--muted);font-weight:500;line-height:1.4;margin-top:2px;}
.benval{flex:none;min-width:56px;text-align:center;font-weight:800;font-size:12.5px;padding:5px 10px;border-radius:var(--r-pill);}
.benval.bonus{background:#FFF4E7;color:var(--orange-2);}
.benval.on{background:var(--tint-2);color:var(--good);}
.benval.off{background:var(--cream);color:var(--muted);}

.segbar{display:flex;gap:6px;}
.seg{flex:1;height:9px;border-radius:var(--r-pill);background:var(--cream);border:1px solid var(--line-2);}
.seg.on{background:var(--teal);border-color:var(--teal);}
.seglabels{margin-top:7px;display:flex;justify-content:space-between;}
.seglabels b{font-size:9.5px;font-weight:700;color:var(--line-2);}
.seglabels b.on{color:var(--teal);}
.growthnote{display:flex;gap:7px;align-items:flex-start;margin-top:14px;padding:11px 12px;border-radius:var(--r-sm);background:var(--cream);color:var(--muted);font-size:11.5px;font-weight:600;line-height:1.45;}
.growthnote svg{flex:none;margin-top:1px;color:var(--orange);}

.earncard{padding:16px;}
.earnlvl{display:flex;align-items:center;gap:11px;}
.earnbadge{width:40px;height:40px;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;flex:none;}
.earnbadge img{width:22px;height:22px;}
.bondh{display:block;font-weight:800;color:var(--teal-ink);font-size:15px;}
.bondsub{display:block;font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.35;}
.bondempty{margin-top:12px;text-align:center;font-size:12px;color:var(--muted);font-weight:600;background:var(--cream);border-radius:var(--r-sm);padding:11px;}

/* ===== GARDEN ===== */
.gardenhero{position:relative;height:212px;overflow:hidden;background:linear-gradient(180deg,#CFEAF6 0%,#E4F2E0 62%,#DCE9C4 100%);}
.gardenground{position:absolute;left:-6%;right:-6%;bottom:-30px;height:104px;border-radius:50% 50% 0 0;background:#C6DA8E;}
.gardenground.g2{bottom:-42px;height:112px;background:#B9D07C;left:-18%;right:-18%;}
.gardenscene{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:20px;z-index:2;}
.gardenscene .gplant{transition:.4s;transform-origin:50% 100%;margin:0 -12px;display:flex;align-items:flex-end;}
.gardenscene .gplant>svg{height:100%;width:auto;display:block;}
.gardenscene .gplant.p0{opacity:.3;filter:grayscale(.85);}
.gardensun{position:absolute;top:16px;right:28px;width:40px;height:40px;border-radius:50%;background:var(--yellow);
  box-shadow:0 0 0 12px rgba(255,218,124,.28);animation:sunpulse 4s ease-in-out infinite;}
@keyframes sunpulse{0%,100%{box-shadow:0 0 0 12px rgba(255,218,124,.24)}50%{box-shadow:0 0 0 18px rgba(255,218,124,.16)}}
.gardencloud{position:absolute;background:rgba(255,255,255,.85);border-radius:var(--r-pill);height:16px;animation:drift 22s linear infinite;}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(460px)}}
.jhero{display:flex;gap:13px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);
  padding:14px;box-shadow:var(--shadow);}
.jheropet{width:76px;height:76px;flex:none;border-radius:var(--r-md);background:#EDF3E4;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;}
.jheropet svg{height:74px;width:auto;}
.jherolabel{font-size:10.5px;font-weight:800;color:var(--orange);text-transform:uppercase;letter-spacing:.4px;}
.jheroh{font-weight:800;font-size:15px;color:var(--teal-ink);margin-top:2px;}
.jherosub{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.45;margin-top:3px;}
.jprog{margin:16px 0 12px;}
.jprogmeta{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--muted);margin-top:7px;}
.jrow{display:flex;align-items:center;gap:12px;padding:13px;border-radius:18px;background:#fff;border:1px solid var(--line);
  box-shadow:var(--shadow-sm);margin-bottom:10px;}
.jrow.locked{opacity:.62;}
.jrow.next{border-color:#F0D9BC;box-shadow:0 6px 16px rgba(226,138,75,.15);}
.jic{width:44px;height:44px;border-radius:14px;background:var(--cream);border:1px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;flex:none;color:var(--teal);overflow:hidden;}
.jrow.owned .jic{background:#EDF3E4;border-color:#D6E3BC;color:#6E8C31;}
.jic svg{width:30px;height:30px;}
.jic img{width:22px;height:22px;object-fit:contain;opacity:.75;}
.jmain{flex:1;min-width:0;}
.jname{font-weight:700;font-size:14px;color:var(--teal-ink);}
.jfinal{font-size:9.5px;font-weight:800;background:var(--yellow);color:#7A4B00;padding:1px 6px;border-radius:var(--r-pill);vertical-align:2px;margin-left:4px;}
.jdesc{font-size:11.5px;color:var(--muted);font-weight:500;line-height:1.35;margin-top:2px;}
.jperk{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--good);background:var(--tint-2);
  border:1px solid #CFE2E8;padding:3px 8px;border-radius:var(--r-pill);margin-top:6px;}
.jdone{width:32px;height:32px;border-radius:50%;background:var(--tint-2);color:var(--good);display:flex;align-items:center;justify-content:center;flex:none;}
.jbuild{display:flex;align-items:center;gap:2px;background:var(--orange);color:#fff;font-weight:800;font-size:13px;
  padding:9px 13px;border-radius:var(--r-sm);box-shadow:0 4px 0 var(--orange-2);flex:none;}
.jbuild:active{transform:translateY(2px);box-shadow:0 2px 0 var(--orange-2);}
.jbuild.off{background:#EDE6D8;color:#A8A08E;box-shadow:none;}
.jlock{display:flex;align-items:center;gap:2px;font-weight:800;font-size:12.5px;color:var(--muted);flex:none;}
.jcardh{font-weight:800;color:var(--teal-ink);font-size:14.5px;}
.jcards{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px;line-height:1.35;}
.jgrowthnote{margin-top:12px;font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.4;display:flex;gap:5px;}
.jgrowthnote .ic{color:var(--teal);flex:none;margin-top:1px;}

/* ===== sheets / shop ===== */
.sheethead{display:flex;align-items:center;gap:12px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));background:#fff;border-bottom:1px solid var(--line);}
.sheethead h2{flex:1;font-size:18px;}
.iconbtn{width:40px;height:40px;border-radius:14px;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);flex:none;}
.iconbtn svg{width:18px;height:18px;stroke:var(--teal);stroke-width:2.5;fill:none;}
.segtabs{display:flex;gap:6px;padding:12px 16px 4px;background:#fff;}
.segtabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:14px;font-weight:700;font-size:12px;color:var(--muted);border:1.5px solid transparent;}
.segtabs button img{width:26px;height:26px;opacity:.55;transition:.15s;}
.segtabs button.on{background:var(--tint);color:var(--orange-2);border-color:#F6DFC4;}
.segtabs button.on img{opacity:1;}
.shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 16px calc(var(--nav-h) + 20px);}
.shopcard{background:#fff;border-radius:18px;padding:12px;box-shadow:var(--shadow-sm);border:1px solid var(--line);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;}
.shopcard .art{width:78px;height:78px;object-fit:contain;margin:6px 0 8px;}
.shopcard .artsvg{width:78px;height:78px;display:flex;align-items:flex-end;justify-content:center;margin:6px 0 8px;}
.shopcard .artsvg svg{height:78px;width:auto;}
.shopcard .cn{font-weight:700;font-size:13.5px;color:var(--teal-ink);}
.shopcard .cd{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;min-height:15px;line-height:1.3;}
.shopcard .buy{margin-top:10px;width:100%;display:flex;align-items:center;justify-content:center;gap:5px;background:var(--orange);color:#fff;font-weight:800;padding:9px;border-radius:var(--r-sm);box-shadow:0 4px 0 var(--orange-2);font-size:13.5px;}
.shopcard .buy img{width:17px;height:17px}
.shopcard .buy:active{transform:translateY(2px);box-shadow:0 2px 0 var(--orange-2);}
.shopcard .buy.owned{background:var(--tint-2);color:var(--good);box-shadow:none;}
.shopcard .buy.equipped{background:var(--teal);box-shadow:0 4px 0 #072f3d;}
.shopcard .buy.equip{background:#fff;color:var(--teal);box-shadow:0 0 0 1.5px var(--line-2) inset;}
.shopcard .buy.prem{background:var(--yellow);color:#7A4B00;box-shadow:0 4px 0 #D9A93C;}
.prembadge{position:absolute;top:8px;left:8px;display:inline-flex;align-items:center;gap:3px;background:var(--yellow);color:#7A4B00;font-size:9.5px;font-weight:800;padding:3px 7px;border-radius:var(--r-pill);z-index:2;}
.qty{position:absolute;top:8px;right:8px;background:var(--cream);border:1px solid var(--line-2);color:var(--teal);font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:var(--r-pill);z-index:2;}

.scrim{position:absolute;inset:0;background:rgba(11,37,48,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both;}
.scrim.closing{animation:fadeout .24s both;}
.scrim.closing .dialog{animation:slidedown .26s cubic-bezier(.4,0,.9,.5) both;}
.dialog{background:#fff;border-radius:26px 26px 0 0;width:100%;max-width:440px;max-height:92vh;overflow-y:auto;padding:22px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.2);animation:slideup .3s cubic-bezier(.2,.8,.2,1) both;}
.dialog .grip{width:40px;height:5px;border-radius:9px;background:var(--line-2);margin:0 auto 16px;}
.dialog .d-art{width:96px;height:96px;object-fit:contain;margin:0 auto 12px;}
.dialog h3{text-align:center;font-size:19px;margin-bottom:4px;}
.dialog .d-sub{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:16px;line-height:1.5;}
.dialog h3.left,.dialog .d-sub.left{text-align:left;}
.d-line{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);font-size:14px;}
.d-line .lbl{color:var(--muted);font-weight:600;}
.d-line .val{font-weight:800;color:var(--teal-ink);display:flex;align-items:center;gap:5px;}
.d-line .val img{width:18px;height:18px}
.d-err{background:#FDECE8;color:#C0432B;font-weight:600;font-size:13px;padding:11px 13px;border-radius:13px;margin:6px 0 4px;display:flex;gap:8px;align-items:center;}
.d-actions{display:flex;gap:10px;margin-top:16px;}
.pgroup{margin-bottom:15px;}
.pglbl{font-size:12px;font-weight:700;color:var(--teal);margin:0 0 8px 2px;display:flex;align-items:center;gap:6px;}
.pgval{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--orange-2);background:var(--tint);border:1px solid #F6DFC4;
  padding:2px 9px;border-radius:var(--r-pill);max-width:52%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hint{display:flex;gap:7px;align-items:center;font-size:11px;font-weight:600;color:var(--muted);margin-top:9px;
  padding:8px 10px;background:var(--cream);border:1px solid var(--line-2);border-radius:10px;line-height:1.35;}
.hint .ic{color:var(--orange);flex:none;}
.pchips{display:grid;gap:8px;}
.pchips.g2{grid-template-columns:repeat(2,1fr);}
.pchips.g3{grid-template-columns:repeat(3,1fr);}
.pchips.g4{grid-template-columns:repeat(4,1fr);}
.pchips.g5{grid-template-columns:repeat(5,1fr);}
.pchips.g7{grid-template-columns:repeat(7,1fr);}
.pchip{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 6px;border-radius:var(--r-sm);background:#fff;border:1.5px solid var(--line-2);font-weight:700;font-size:13px;color:var(--teal-ink);white-space:nowrap;}
.pchip.on{background:var(--tint);border-color:var(--orange);color:var(--orange-2);}
.pchip.sq{padding:9px 0;}
.timerow{display:flex;gap:8px;align-items:stretch;}
.timerow .pchip{flex:none;padding:9px 20px;}
.timebtn{flex:1;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 12px;border-radius:var(--r-sm);background:#fff;border:1.5px solid var(--line-2);
  font-weight:700;font-size:13px;color:var(--teal-ink);white-space:nowrap;transition:.14s;}
.timebtn.on{background:var(--tint);border-color:var(--orange);color:var(--orange-2);}
.timebtn.open{border-color:var(--orange);}
.timebtn .ic{opacity:.75;flex:none;}
.timebtn span{font-size:14px;font-weight:800;letter-spacing:.2px;}
.timepop{display:flex;align-items:stretch;justify-content:center;gap:4px;margin-top:8px;padding:7px;
  background:var(--cream);border:1.5px solid var(--line-2);border-radius:var(--r-sm);}
.twheel{position:relative;flex:1;max-width:118px;height:128px;overflow-y:auto;overscroll-behavior:contain;
  scroll-snap-type:y proximity;display:flex;flex-direction:column;gap:4px;padding:1px;
  scrollbar-width:none;-ms-overflow-style:none;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 16%,#000 84%,transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 16%,#000 84%,transparent 100%);}
.twheel::-webkit-scrollbar{display:none;}
.twheel .ti{scroll-snap-align:center;flex:none;padding:8px 0;border-radius:var(--r-sm);background:#fff;
  border:1.5px solid var(--line-2);font-weight:700;font-size:13px;color:var(--teal-ink);transition:.12s;}
.twheel .ti.on{background:var(--tint);border-color:var(--orange);color:var(--orange-2);}
.twheel .ti:active{transform:scale(.97);}
.tcolon{display:flex;align-items:center;font-weight:800;font-size:16px;color:#BFB7A5;}
.iconpick{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;}
.iconpick button{aspect-ratio:1;border-radius:13px;background:#fff;border:1.5px solid var(--line-2);display:flex;align-items:center;justify-content:center;padding:5px;}
.iconpick button svg{width:100%;height:100%;}
.iconpick button.on{background:var(--tint);border-color:var(--orange);box-shadow:0 0 0 2px rgba(226,138,75,.16);}
.feedgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:6px;}
.fooditem{background:var(--cream);border-radius:var(--r-md);padding:10px 6px;text-align:center;border:2px solid var(--line);position:relative;}
.fooditem:active{transform:scale(.96);}
.fooditem img{width:46px;height:46px;object-fit:contain;margin:0 auto 4px;}
.fooditem .fn{font-size:11px;font-weight:700;color:var(--teal-ink);}
.fooditem .fh{font-size:10.5px;font-weight:700;color:var(--good);}
.fooditem .fq{position:absolute;top:4px;right:4px;background:#fff;border:1px solid var(--line-2);font-size:10px;font-weight:800;color:var(--teal);padding:1px 6px;border-radius:var(--r-pill);}
.fooditem.empty{opacity:.4;pointer-events:none;}
.healthprev{display:flex;align-items:center;gap:8px;background:var(--cream);border:1px solid var(--line-2);border-radius:var(--r-sm);
  padding:10px 12px;margin-top:12px;font-size:12px;font-weight:700;color:var(--teal-ink);}
.healthprev .pbar{flex:1;height:10px;border-radius:9px;background:#EFE7D6;overflow:hidden;position:relative;}
.healthprev .pnow{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--yellow-2),var(--yellow));border-radius:9px;}
.healthprev .padd{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#A7C34F,#A7C34F 4px,#BBD16A 4px,#BBD16A 8px);opacity:.85;}

/* ===== achievements ===== */
.achtop{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow);}
.cring{position:relative;display:inline-flex;line-height:0;flex:none;}
.cringv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--teal-ink);font-size:18px;}
.achtopn{font-weight:800;color:var(--teal-ink);font-size:15px;}
.achgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.achcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px 11px;text-align:center;box-shadow:var(--shadow-sm);position:relative;}
.achcard.locked{opacity:.62;background:var(--cream);}
.achic{width:46px;height:46px;margin:0 auto 8px;border-radius:50%;background:var(--cream);border:1px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;color:var(--teal);}
.achcard.got .achic{background:#FFF4E7;border-color:#F6DFC4;color:var(--orange);}
.acht{font-weight:800;font-size:13px;color:var(--teal-ink);}
.achd{font-size:10.5px;color:var(--muted);font-weight:600;line-height:1.35;margin-top:3px;min-height:28px;}
.achprog{height:6px;border-radius:9px;background:#EFE7D6;overflow:hidden;margin-top:8px;}
.achprog i{display:block;height:100%;background:var(--orange);border-radius:9px;}
.achpt{font-size:10px;font-weight:800;color:var(--muted);margin-top:4px;}
.achstars{position:absolute;top:8px;right:8px;display:flex;gap:1px;}
.achstars svg{width:13px;height:13px;}

/* ===== insights ===== */
.heatwrap{padding-bottom:4px;}
.heatrow{display:flex;gap:5px;margin-bottom:4px;align-items:center;}
.heatlbl{width:60px;flex:none;font-size:9.5px;font-weight:700;color:var(--teal-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.heatcells{display:flex;gap:1px;flex:1;min-width:0;}
.hc{width:5px;height:13px;border-radius:2px;background:#F0D9D0;flex:1 1 0;min-width:0;}
.hc.done{background:#7FA53C}
.hc.na{background:#F3EEE1}
.heatlegend{display:flex;align-items:center;gap:12px;justify-content:center;font-size:10px;font-weight:700;color:var(--muted);margin-top:10px;flex-wrap:wrap;}
.heatlegend span{display:flex;align-items:center;gap:4px;}
.heatlegend .hc{width:11px;flex:none;height:11px;border-radius:3px;}
.wkbars{display:flex;align-items:flex-end;gap:6px;height:112px;margin:16px 0 6px;padding-bottom:20px;position:relative;}
.wkbars::after{content:"";position:absolute;left:0;right:0;bottom:20px;height:1.5px;background:var(--line-2);border-radius:2px;}
.wkcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;min-width:0;}
.wkbar{width:100%;max-width:26px;background:linear-gradient(180deg,var(--teal-2),var(--teal));border-radius:5px 5px 0 0;transition:height .45s;position:relative;z-index:1;}
.wkbar.hi{background:linear-gradient(180deg,#B7D25E,#8FB94E);}
.wkbar.miss{height:4px!important;background:#F0C7BC;border-radius:2px;}
.wkbar.fut{height:4px!important;background:#EFE7D6;border-radius:2px;}
.wkcol span{position:absolute;bottom:-19px;z-index:2;font-size:9.5px;font-weight:700;color:#BFB7A5;white-space:nowrap;}
.wkcol span.on{color:var(--orange);}
.wkcard{padding:15px 16px;}
.wkbig{font-weight:800;color:var(--teal-ink);font-size:22px;margin-top:2px;}
.wktag{display:inline-flex;align-items:center;gap:5px;background:var(--cream);border:1px solid var(--line-2);color:var(--muted);font-weight:700;font-size:11px;padding:5px 10px;border-radius:var(--r-pill);}
.wktag svg{color:var(--orange);}
.wksub{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.45;}
.hlrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);}
.hlrow:last-child{border-bottom:none;}
.hlic{width:32px;height:32px;border-radius:10px;flex:none;background:var(--cream);color:var(--teal);display:flex;align-items:center;justify-content:center;}
.hlt{flex:1;font-size:13.5px;font-weight:600;color:var(--teal-ink);}
.hlv{font-size:13px;font-weight:800;color:var(--teal-ink);}

/* ===== profile / premium / referral / recap ===== */
.profhead{background:linear-gradient(180deg,#0C4C60,#12667F);padding:calc(16px + env(safe-area-inset-top)) 16px 22px;color:#fff;position:relative;}
.profav{display:flex;align-items:center;gap:14px;}
.profav img{width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,255,255,.85);object-fit:cover;background:#DDEDE9;}
.profnm{font-weight:800;font-size:19px;}
.profsub{font-size:12px;color:#BFE3F3;font-weight:600;margin-top:2px;}
.xpbar{height:9px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:12px;}
.xpbar i{display:block;height:100%;background:var(--yellow);border-radius:9px;}
.xpmeta{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:#BFE3F3;margin-top:6px;}
.setrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
.setrow:last-child{border-bottom:none;}
.setic{width:36px;height:36px;border-radius:12px;background:var(--cream);color:var(--teal);display:flex;align-items:center;justify-content:center;flex:none;}
.sett{flex:1;font-size:14px;font-weight:600;color:var(--teal-ink);}
.setsub{font-size:11px;color:var(--muted);font-weight:500;margin-top:1px;}
.tgl{width:46px;height:27px;border-radius:var(--r-pill);background:var(--line-2);position:relative;transition:.2s;flex:none;}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.2);}
.tgl.on{background:var(--good);}
.tgl.on::after{transform:translateX(19px);}
.pbg{background:linear-gradient(180deg,#0C4C60,#12667F);padding:calc(26px + env(safe-area-inset-top)) 24px 26px;text-align:center;position:relative;}
.plan{background:#fff;border:2px solid var(--line);border-radius:18px;padding:15px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;position:relative;}
.plan.best{border-color:var(--orange);background:var(--tint);}
.bestbadge{position:absolute;top:-9px;left:16px;background:var(--orange);color:#fff;font-size:9.5px;font-weight:800;padding:3px 9px;border-radius:var(--r-pill);letter-spacing:.4px;}
.pdur{font-weight:800;font-size:15.5px;color:var(--teal-ink);}
.psub{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:1px;}
.pprice{text-align:right;}
.pp{font-weight:800;color:var(--teal-ink);font-size:15px;}
.pm{font-size:11px;color:var(--muted);font-weight:600;}
.unlockrow{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13px;font-weight:600;color:var(--teal-ink);line-height:1.4;}
.unlockrow .ck{width:22px;height:22px;border-radius:50%;background:var(--tint-2);color:var(--good);display:flex;align-items:center;justify-content:center;flex:none;}
.unlockrow .ck svg{width:14px;height:14px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.section-note{font-size:11.5px;color:var(--muted);text-align:center;padding:10px 16px 0;line-height:1.5;}
.refcard{background:linear-gradient(120deg,#0C4C60,#12667F);border-radius:22px;padding:18px;color:#fff;box-shadow:var(--shadow);}
.refcode{background:rgba(255,255,255,.16);border:1.5px dashed rgba(255,255,255,.5);border-radius:var(--r-sm);padding:11px;text-align:center;font-weight:800;font-size:18px;letter-spacing:3px;margin:12px 0;}
.offnote{display:flex;gap:8px;align-items:flex-start;margin-top:14px;padding:11px 13px;border-radius:var(--r-sm);background:var(--cream);border:1px solid var(--line-2);color:var(--muted);font-size:11.5px;font-weight:600;line-height:1.45;}
.offnote svg{flex:none;margin-top:1px;color:var(--teal);}
.recappet{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:15px;position:relative;z-index:2;
  border-top:1px solid rgba(255,255,255,.14);}
.rpmain{min-width:0;flex:1;}
.rpname{font-size:13px;font-weight:800;color:#fff;letter-spacing:.1px;margin-bottom:9px;}
/* both rows share one grid, so the two values line up in a single column */
.rprow{display:grid;grid-template-columns:50px 1fr 52px;align-items:center;gap:9px;margin-top:7px;}
.rpk{font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#8FBACB;}
.rpbar{height:7px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden;}
.rpbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--yellow-2),var(--yellow));}
.rppips{display:flex;align-items:center;gap:4px;}
.rppips i{flex:1;max-width:26px;height:7px;border-radius:999px;background:rgba(255,255,255,.18);}
.rppips.wide i{max-width:46px;}
.rppips i.on{background:var(--yellow);}
.rpnote{font-size:11px;font-weight:600;color:#9FC9D8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rpv{text-align:right;font-size:14px;font-weight:800;color:#fff;line-height:1;white-space:nowrap;}
.rpv small{font-size:10px;font-weight:700;color:#9FC9D8;}

.recapcard{background:linear-gradient(160deg,var(--teal),var(--teal-2));border-radius:24px;padding:20px;color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.recapcard::after{content:"";position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,218,124,.14);}
.recapgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;position:relative;z-index:2;}
.rcell{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:var(--r-md);padding:12px;}
.rcell .rv{font-size:22px;font-weight:800;line-height:1;}
.rcell .rl{font-size:10.5px;font-weight:700;color:#BFE3F3;text-transform:uppercase;letter-spacing:.3px;margin-top:4px;}

/* ===== empty ===== */
.empty{text-align:center;padding:34px 20px;color:var(--muted);}
.empty .em-ic{margin-bottom:8px;display:flex;justify-content:center;color:var(--line-2);}
.empty .em-t{font-weight:700;color:var(--teal-ink);font-size:15px;margin-bottom:4px;}
.empty .em-s{font-size:13px;line-height:1.5;}
/* the "no habits at all" screen: an entry point, not a shrug */
.startercard{margin-top:14px;text-align:center;padding:26px 18px 20px;color:var(--muted);background:var(--card);
  border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);}
.startercard .em-ic{margin-bottom:8px;display:flex;justify-content:center;color:var(--line-2);}
.startercard .em-t{font-weight:800;color:var(--teal-ink);font-size:16px;margin-bottom:4px;}
.startercard .em-s{font-size:13px;line-height:1.5;}
.starterchips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 12px;}
.starterchip{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:var(--r-sm);
  background:var(--cream);border:1.5px solid var(--line-2);font-size:12px;font-weight:700;
  color:var(--teal-ink);text-align:left;line-height:1.25;transition:.14s;}
.starterchip:active{transform:scale(.97);}
.starterchip .scart{width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center;}
.starterchip .scart svg,.starterchip .scart img{width:100%;height:100%;object-fit:contain;}
/* the "what will live here" preview under an empty dashboard */
.hbv.na{font-size:10px;font-weight:700;color:var(--muted);}
.insprev{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:26px;}
.insprev span{font-size:10.5px;font-weight:700;color:var(--line-2);background:var(--card);
  border:1px dashed var(--line-2);border-radius:var(--r-pill);padding:5px 10px;}

.restring{width:88px;height:88px;border-radius:50%;background:var(--cream);border:1.5px dashed var(--line-2);
  display:flex;align-items:center;justify-content:center;color:var(--line-2);}

/* ===== toast / reward / confetti ===== */
#toast{position:absolute;left:50%;bottom:calc(var(--nav-h) + 26px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:rgba(11,37,48,.95);color:#fff;font-weight:600;font-size:13.5px;padding:11px 16px;border-radius:var(--r-md);
  display:flex;align-items:center;gap:8px;z-index:80;opacity:0;transition:.25s;pointer-events:none;max-width:86%;text-align:left;line-height:1.35;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.high{bottom:auto;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);}
#toast.high.show{transform:translateX(-50%) translateY(0);}
#toast img{width:20px;height:20px}
#reward{position:absolute;inset:0;z-index:70;background:rgba(11,37,48,.55);display:none;align-items:center;justify-content:center;padding:24px;}
#reward.show{display:flex;animation:fade .25s both;}
.rewardcard{background:#fff;border-radius:26px;padding:26px 22px;text-align:center;width:100%;max-width:330px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .45s cubic-bezier(.2,1.3,.4,1) both;max-height:88vh;overflow-y:auto;}
.rewardcard .burst{display:flex;justify-content:center;margin-bottom:2px;animation:spinin 1.2s ease;}
@keyframes spinin{from{transform:rotate(-20deg) scale(.5)}to{transform:none}}
.rewardcard h2{font-size:23px;margin:6px 0 3px;}
.rewardcard p{color:var(--muted);font-size:14px;margin:0 0 18px;line-height:1.45;}
.rewardstats{display:flex;gap:12px;justify-content:center;margin-bottom:18px;}
.rewardstats .rs{background:var(--cream);border-radius:var(--r-md);padding:12px 18px;border:1px solid var(--line);}
.rewardstats .rs .rv{font-size:22px;font-weight:800;color:var(--teal-ink);display:flex;align-items:center;gap:5px;justify-content:center;}
.rewardstats .rs .rv img{width:20px;height:20px}
.rewardstats .rs .rl{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-top:2px;}
.rewardbonus{display:inline-flex;align-items:center;gap:6px;background:#FFF4E7;border:1px solid #F6DFC4;color:var(--orange-2);font-weight:700;font-size:12.5px;padding:8px 13px;border-radius:var(--r-sm);line-height:1.3;}
.rewardbonus.muted-bonus{background:var(--cream);border-color:var(--line-2);color:var(--muted);font-weight:600;}
.rewardgoal{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:12px;}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:75;overflow:hidden;}
.conf{position:absolute;width:9px;height:14px;top:-20px;border-radius:2px;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(960px) rotate(720deg);opacity:.3}}

/* ===== nursery / hatch overlay ===== */
#nursery{background:radial-gradient(circle at 50% 38%, #16657D 0%, #0C4C60 55%, #08394A 100%);z-index:72;}
.nurs{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 24px calc(26px + env(safe-area-inset-bottom));position:relative;}
.nursstage{position:relative;width:250px;height:280px;display:flex;align-items:center;justify-content:center;}
.nursegg{height:250px;z-index:3;position:relative;}
.nursegg svg{height:100%;width:auto;display:block;filter:drop-shadow(0 16px 20px rgba(0,0,0,.35));}
.nursegg.shake{animation:eggshake .42s ease-in-out 3;}
@keyframes eggshake{0%,100%{transform:rotate(0) translateX(0)}25%{transform:rotate(-7deg) translateX(-5px)}75%{transform:rotate(7deg) translateX(5px)}}
.nursegg.burstout{animation:eggburst .5s cubic-bezier(.2,1.5,.4,1) both;}
@keyframes eggburst{0%{transform:scale(1)}45%{transform:scale(1.13)}100%{transform:scale(1)}}
.nurspet{height:230px;z-index:3;position:relative;animation:revealpet .8s cubic-bezier(.2,1.4,.4,1) both;}
.nurspet svg{height:100%;width:auto;display:block;filter:drop-shadow(0 16px 20px rgba(0,0,0,.35));}
@keyframes revealpet{from{transform:scale(.3) translateY(40px);opacity:0}to{transform:none;opacity:1}}
.starburst{position:absolute;inset:-30px;z-index:1;pointer-events:none;}
.starburst i{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;opacity:0;}
.starburst i svg{width:100%;height:100%;}
.starburst.go i{animation:starfly 1.1s cubic-bezier(.2,.8,.3,1) forwards;}
@keyframes starfly{0%{opacity:0;transform:translate(0,0) scale(.2) rotate(0)}
  25%{opacity:1}
  100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(1.1) rotate(220deg)}}
.nursglow{position:absolute;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,218,124,.55) 0%, rgba(255,218,124,0) 66%);z-index:1;opacity:0;transition:opacity .5s;}
.nursglow.on{opacity:1;animation:glowpulse 2.4s ease-in-out infinite;}
@keyframes glowpulse{0%,100%{transform:scale(.94)}50%{transform:scale(1.06)}}
.nurstxt{text-align:center;margin-top:6px;z-index:4;position:relative;}
.nurstxt h2{color:#fff;font-size:25px;line-height:1.2;}
.nurstxt p{color:#BFE3F3;font-size:14px;font-weight:600;margin:8px 0 0;line-height:1.5;}
.nursfoot{width:100%;max-width:330px;margin-top:22px;z-index:4;position:relative;}
.nursskip{position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;color:#BFE3F3;font-size:12.5px;font-weight:700;z-index:6;padding:8px 12px;border-radius:var(--r-pill);background:rgba(255,255,255,.1);}

/* misc */
.dev{position:absolute;left:0;right:0;top:0;height:14px;z-index:95;opacity:0;}   /* hidden reset: triple-tap the very top edge */
.startrow{display:flex;gap:2px;}
.smallnote{font-size:11px;color:var(--muted);font-weight:600;line-height:1.45;margin-top:8px;}
.bignum{font-size:26px;font-weight:800;color:var(--teal-ink);line-height:1;}
.divider{height:1px;background:var(--line);margin:14px 0;}
.starthere{font-size:9.5px;font-weight:800;background:var(--orange);color:#fff;padding:2px 7px;border-radius:var(--r-pill);margin-left:6px;vertical-align:2px;letter-spacing:.3px;}
.mini-cat{width:26px;height:26px;flex:none;}
.sortbtn{width:30px;height:30px;border-radius:10px;background:var(--cream);border:1px solid var(--line-2);color:var(--teal);display:flex;align-items:center;justify-content:center;flex:none;}
.sortbtn:active{transform:scale(.92);}
.sortbtn[disabled]{opacity:.35;pointer-events:none;}
.hactions{display:flex;gap:6px;flex:none;}
@media (prefers-reduced-motion: reduce){
  .petart,.eggart,.gardensun,.gardencloud,.pilecoin img{animation:none!important;}
}

/* ============================================================
   INSIGHTS DASHBOARD
   ============================================================ */
.subtabs{display:flex;gap:5px;overflow-x:auto;padding:12px 12px 10px;background:#fff;border-bottom:1px solid var(--line);}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;padding:8px 11px;border-radius:var(--r-pill);font-weight:700;font-size:12px;color:var(--muted);
  background:var(--cream);border:1.5px solid var(--line-2);display:flex;align-items:center;gap:5px;white-space:nowrap;}
.subtabs button.on{background:var(--teal);border-color:var(--teal);color:#fff;}
.subtabs button.on .ic{color:#fff;}
.subtabs button .ic{color:var(--muted);}
.rangebar{display:flex;gap:6px;padding:10px 16px 0;}
.rangebar button{flex:1;padding:7px 4px;border-radius:var(--r-sm);font-weight:700;font-size:12px;color:var(--muted);
  background:#fff;border:1.5px solid var(--line-2);position:relative;}
.rangebar button.on{background:var(--tint);border-color:var(--orange);color:var(--orange-2);}
.rangebar button .plock{position:absolute;top:-6px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--yellow);
  display:flex;align-items:center;justify-content:center;color:#7A4B00;}
.rangebar button .plock svg{width:9px;height:9px;}

.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sgrid.g3{grid-template-columns:1fr 1fr 1fr;}
.scard{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:12px 13px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;}
.scard .sk{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
.scard .sk .ic{color:var(--teal);}
.scard .sv{font-size:23px;font-weight:800;color:var(--teal-ink);line-height:1.05;margin-top:6px;display:flex;align-items:baseline;gap:4px;}
.scard .sv small{font-size:12px;font-weight:700;color:var(--muted);}
.scard .ss{font-size:11px;font-weight:600;color:var(--muted);margin-top:3px;line-height:1.35;}
.delta{display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:800;padding:2px 7px 2px 5px;border-radius:var(--r-pill);margin-top:6px;}
.delta.up{background:#E7F2E4;color:#4C7A32;}
.delta.down{background:#FDECE8;color:#B9553C;}
.delta.flat{background:var(--cream);color:var(--muted);}
.delta svg{width:11px;height:11px;}

.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:15px 16px;margin-bottom:12px;position:relative;}
.panel-h{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
.panel-h h4{font-size:14.5px;font-weight:800;color:var(--teal-ink);flex:1;}
.panel-h .ic{color:var(--teal);}
.panel-s{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.4;margin-bottom:12px;}
.panel-f{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.45;margin-top:11px;padding-top:11px;border-top:1px solid var(--line);}
.panel-f b{color:var(--teal-ink);}

/* premium lock */
.locked{position:relative;overflow:hidden;min-height:178px;border-radius:14px;display:flex;flex-direction:column;justify-content:center;}
.locked .lockbody{filter:blur(4.5px);opacity:.5;pointer-events:none;user-select:none;}
.lockover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.93));border-radius:14px;padding:12px;text-align:center;z-index:3;overflow:hidden;}
.lockover .lb{width:32px;height:32px;border-radius:50%;background:var(--yellow);color:#7A4B00;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(244,185,66,.4);flex:none;}
.lockover .lt{font-weight:800;font-size:13px;color:var(--teal-ink);line-height:1.2;}
.lockover .ls{font-size:11px;color:var(--muted);font-weight:600;max-width:220px;line-height:1.35;}
.lockover .btn{padding:8px 14px;font-size:12.5px;border-radius:11px;box-shadow:0 4px 0 var(--orange-2);margin-top:2px;}
.lockover .btn:active{box-shadow:0 1px 0 var(--orange-2);}

/* horizontal bar list */
.hbar{display:flex;align-items:center;gap:9px;padding:7px 0;}
.hbar .hbn{width:96px;flex:none;font-size:11.5px;font-weight:700;color:var(--teal-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hbar .hbt{flex:1;height:16px;border-radius:8px;background:var(--cream);overflow:hidden;position:relative;border:1px solid var(--line);}
.hbar .hbf{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--teal-2),var(--teal));transition:width .5s;min-width:3px;}
.hbar .hbf.g{background:linear-gradient(90deg,#8FB94E,#B7D25E);}
.hbar .hbf.o{background:linear-gradient(90deg,var(--orange),#EEA872);}
.hbar .hbv{width:44px;flex:none;text-align:right;font-size:11.5px;font-weight:800;color:var(--teal-ink);}
.hstack{padding:10px 0;border-bottom:1px solid var(--line);}
.hstack:last-child{border-bottom:none;padding-bottom:2px;}
.hstop{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.hsic{width:20px;height:20px;flex:none;display:flex;align-items:center;justify-content:center;}
.hsic svg,.hsic img{width:100%;height:100%;object-fit:contain;}
.hsn{flex:1;min-width:0;font-size:12.5px;font-weight:700;color:var(--teal-ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hsv{flex:none;font-size:12px;font-weight:800;color:var(--teal-ink);}
.hsv.na{font-size:10.5px;font-weight:700;color:var(--muted);}
.hst{display:block;height:10px;border-radius:999px;background:var(--cream);border:1px solid var(--line);overflow:hidden;}
.hsf{display:block;height:100%;border-radius:999px;min-width:0;transition:width .5s;
  background:linear-gradient(90deg,var(--teal-2),var(--teal));}
.hsf.g{background:linear-gradient(90deg,#8FB94E,#B7D25E);}
.hsf.o{background:linear-gradient(90deg,var(--orange),#EEA872);}

/* rank rows */
.rank{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);}
.rank:last-child{border-bottom:none;}
.rank .rn{width:22px;height:22px;border-radius:50%;background:var(--cream);border:1px solid var(--line-2);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:var(--muted);}
.rank .rn.top{background:var(--yellow);border-color:var(--yellow-2);color:#7A4B00;}
.rank .ric{width:30px;height:30px;flex:none;border-radius:10px;background:var(--cream);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.rank .ric svg{width:22px;height:22px;}
.rank .rmain{flex:1;min-width:0;}
.rank .rt{font-size:13px;font-weight:700;color:var(--teal-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rank .rs{font-size:10.5px;font-weight:600;color:var(--muted);margin-top:1px;}
.rank .rv{flex:none;font-size:13px;font-weight:800;color:var(--teal-ink);text-align:right;}
.rank .rv small{display:block;font-size:9.5px;font-weight:700;color:var(--muted);}

/* calendar grid */
.calwrap{display:flex;gap:4px;align-items:flex-start;}
.calcol{display:flex;flex-direction:column;gap:4px;flex:1;}
.calhead{font-size:9px;font-weight:800;color:var(--line-2);text-align:center;height:12px;}
.caldot{width:100%;aspect-ratio:1;border-radius:6px;background:#F3EEE1;position:relative;}
.caldot.p{background:#F0D9D0;}
.caldot.ac{background:#7FA53C;}
.caldot.fz{background:#BFE3F3;}
.caldot.now{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--orange);}
.caldot.fut{background:#FAF6EC;}

/* donut */
.donutwrap{display:flex;align-items:center;gap:16px;}
.donutlegend{flex:1;min-width:0;}
.dleg{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:11.5px;font-weight:700;color:var(--teal-ink);}
.dleg i{width:10px;height:10px;border-radius:3px;flex:none;}
.dleg span{margin-left:auto;font-weight:800;color:var(--muted);font-size:11px;}

/* line chart */
.lc{width:100%;display:block;}
.lcx{display:flex;justify-content:space-between;font-size:9.5px;font-weight:700;color:var(--line-2);margin-top:5px;}

/* insight callout */
.callout{display:flex;gap:9px;align-items:flex-start;background:var(--cream);border:1px solid var(--line-2);
  border-radius:var(--r-sm);padding:10px 12px;margin-top:11px;font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.45;}
.callout .ic{color:var(--orange);flex:none;margin-top:1px;}
.callout b{color:var(--teal-ink);}
.callout.good{background:#F1F7EE;border-color:#DCEBD2;}
.callout.good .ic{color:#5B8A38;}
.callout.warn{background:#FFF4E7;border-color:#F6DFC4;}

/* records */
.recgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.rec{background:var(--cream);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:11px 12px;}
.rec .rk{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
.rec .rv2{font-size:17px;font-weight:800;color:var(--teal-ink);margin-top:3px;line-height:1.1;}
.rec .rd{font-size:10.5px;font-weight:600;color:var(--muted);margin-top:2px;}

/* timeline */
/* the rail sits at x=9 inside .tl, so the marker is pinned to that exact point
   and centred with a transform. box-sizing:border-box matters here: the global
   * rule does not reach pseudo-elements, so the border would otherwise widen
   the dot and push it off the line. */
.tl{position:relative;padding-left:26px;}
.tl::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line);}
.tlrow{position:relative;padding:8px 0;}
.tlrow::before{content:'';box-sizing:border-box;position:absolute;
  left:-17px;top:17px;transform:translate(-50%,-50%);
  width:13px;height:13px;border-radius:50%;background:#fff;border:2.5px solid var(--line-2);}
.tlrow.on::before{border-color:var(--orange);background:var(--orange);}
.tlt{font-size:12.5px;font-weight:700;color:var(--teal-ink);line-height:18px;}
.tld{font-size:10.5px;font-weight:600;color:var(--muted);margin-top:1px;}

/* premium row treatment */
.setic.prem{background:#FFF4E7;color:var(--yellow-2);}
.plusrow{display:flex;align-items:center;gap:13px;width:100%;text-align:left;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#FFF9EC 0%,#FFF0D8 100%);border:1.5px solid #F1D9A8;border-radius:var(--r-lg);
  padding:14px 15px;box-shadow:0 8px 18px rgba(244,185,66,.20);}
.plusrow::after{content:"";position:absolute;top:-38px;right:-26px;width:118px;height:118px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,218,124,.55),rgba(255,218,124,0) 70%);}
.plusrow:active{transform:scale(.99);}
.plusic{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,#FFDA7C,#F4B942);color:#7A4B00;
  display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 5px 12px rgba(244,185,66,.5);position:relative;z-index:2;}
.plusmain{flex:1;min-width:0;position:relative;z-index:2;}
.plust{font-weight:800;font-size:15.5px;color:var(--teal-ink);display:flex;align-items:center;gap:6px;}
.plusb{font-size:8.5px;font-weight:800;background:var(--good);color:#fff;padding:2px 6px;border-radius:var(--r-pill);letter-spacing:.4px;}
.pluss{font-size:11.5px;color:#8A7550;font-weight:600;margin-top:3px;line-height:1.35;}
.pluscta{flex:none;position:relative;z-index:2;font-size:12px;font-weight:800;color:#7A4B00;background:var(--yellow);
  border:1px solid #E8C46A;padding:8px 13px;border-radius:var(--r-pill);white-space:nowrap;}
.rec .rv2,.rec .rd{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.scard .ss{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
</style>
</head>
<body>
<div id="device">

  <!-- ============ SPLASH ============ -->
  <section class="screen active" id="splash">
    <div class="glow"></div>
    <div class="logo" id="splashLogo"></div>
    <div class="word">HabitHatch</div>
    <div class="stag">Keep your habits. Hatch a friend.</div>
    <div class="quote" id="splashQuote"></div>
    <div class="loader"><i></i></div>
  </section>

  <!-- ============ ONBOARDING ============ -->
  <section class="screen" id="onboarding">
    <div class="ob" id="obBody"></div>
  </section>

  <!-- ============ MAIN TABS ============ -->
  <section class="screen" id="main">
    <div class="scroll" id="tabToday"></div>
    <div class="scroll" id="tabHabits" style="display:none"></div>
    <div class="scroll" id="tabPet" style="display:none"></div>
    <div class="scroll" id="tabGarden" style="display:none"></div>

    <nav class="tabbar">
      <button data-tab="today" class="on" onclick="switchTab('today')">
        <span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="3.2"/><path d="M3.5 9.2h17M8 2.6v3.6M16 2.6v3.6"/><path d="M8.4 14.2l2.4 2.4 4.8-5"/></svg></span>
        <span class="lbl">Today</span></button>
      <button data-tab="habits" onclick="switchTab('habits')">
        <span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6.5h11M9.5 12h11M9.5 17.5h11"/><path d="M3.2 6.3l1.5 1.5L7.6 5"/><path d="M3.2 11.8l1.5 1.5L7.6 10.5"/><circle cx="4.6" cy="17.5" r="1.6"/></svg></span>
        <span class="lbl">Habits</span></button>
      <button class="capbtn" onclick="openEditor()" aria-label="Add a habit"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button data-tab="pet" onclick="switchTab('pet')">
        <span class="ni"><svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="7" cy="7.4" rx="2.1" ry="2.7"/><ellipse cx="12" cy="6.1" rx="2.1" ry="2.7"/><ellipse cx="17" cy="7.4" rx="2.1" ry="2.7"/><ellipse cx="19.6" cy="12.3" rx="1.9" ry="2.4"/><ellipse cx="4.4" cy="12.3" rx="1.9" ry="2.4"/><path d="M12 11.4c2.6 0 4.6 1.9 5.6 4 1.1 2.3-.5 4.8-3 4.8-.9 0-1.8-.3-2.6-.3s-1.7.3-2.6.3c-2.5 0-4.1-2.5-3-4.8 1-2.1 3-4 5.6-4z"/></svg></span>
        <span class="lbl">Companion</span></button>
      <button data-tab="garden" onclick="switchTab('garden')">
        <span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-8"/><path d="M12 13c0-3.4 2.7-5.6 6.6-5.6 0 3.4-2.7 5.6-6.6 5.6z"/><path d="M12 13.6C12 10.7 9.6 8.7 6.2 8.7c0 2.9 2.4 4.9 5.8 4.9z"/><path d="M6 21h12"/></svg></span>
        <span class="lbl">Garden</span></button>
    </nav>
  </section>

  <!-- ============ OVERLAY SCREENS ============ -->
  <section class="screen overlay" id="profile"><div class="scroll" id="profileBody"></div></section>

  <section class="screen overlay" id="shop">
    <div class="sheethead">
      <button class="iconbtn" onclick="closeShop()"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h2>Shop</h2>
      <span class="coinpill" id="shopCoins"></span>
    </div>
    <div class="segtabs" id="shopTabs"></div>
    <div class="scroll"><div class="shopgrid" id="shopGrid"></div></div>
  </section>

  <section class="screen overlay" id="insights">
    <div class="sheethead">
      <button class="iconbtn" onclick="closeScreen('insights')"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h2>Insights</h2><div style="width:40px"></div>
    </div>
    <div class="subtabs" id="insightsTabs"></div>
    <div class="scroll" id="insightsBody"></div>
  </section>

  <section class="screen overlay" id="achievements">
    <div class="sheethead">
      <button class="iconbtn" onclick="closeScreen('achievements')"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h2>Achievements</h2><div style="width:40px"></div>
    </div>
    <div class="scroll" id="achievementsBody"></div>
  </section>

  <section class="screen overlay" id="premium">
    <div class="pbg">
      <button class="iconbtn" style="position:absolute;left:16px;top:calc(20px + env(safe-area-inset-top))" onclick="closeScreen('premium')"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div style="color:#FFDA7C;display:flex;justify-content:center"><svg width="42" height="42" viewBox="0 0 24 24" fill="currentColor"><path d="M4 8.5 7.5 12 12 5.5 16.5 12 20 8.5 18.5 18h-13z"/></svg></div>
      <h2 style="color:#fff;font-size:23px;margin-top:6px">HabitHatch+</h2>
      <p style="color:#BFE3F3;font-size:13.5px;margin:6px 0 0;line-height:1.5">Make it yours on day one: five themes, every companion and outfit.<br>All Garden perks stay earnable with coins, always.</p>
    </div>
    <div class="scroll" id="premiumBody"></div>
  </section>

  <section class="screen overlay" id="referral">
    <div class="sheethead">
      <button class="iconbtn" onclick="closeScreen('referral')"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h2>Invite friends</h2><div style="width:40px"></div>
    </div>
    <div class="scroll" id="referralBody"></div>
  </section>

  <section class="screen overlay" id="recap">
    <div class="sheethead">
      <button class="iconbtn" onclick="closeScreen('recap')"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h2>Weekly recap</h2><div style="width:40px"></div>
    </div>
    <div class="scroll" id="recapBody"></div>

/* ============================================================
   DATE HELPERS: all day boundaries are LOCAL YYYY-MM-DD strings
   ============================================================ */
const pad2=n=>String(n).padStart(2,'0');
function noon(d){ const x=new Date(d); x.setHours(12,0,0,0); return x; }
function dstr(d){ d=noon(d); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function today(){ return dstr(new Date()); }
function dOff(n,from){ const d=noon(from?new Date(from+'T12:00:00'):new Date()); d.setDate(d.getDate()+n); return d; }
function dstrOff(n,from){ return dstr(dOff(n,from)); }
function parseD(s){ return new Date(s+'T12:00:00'); }
function dow(s){ return parseD(s).getDay(); }
function daysBetween(a,b){ return Math.round((parseD(b)-parseD(a))/86400000); }
function isoWeek(s){
  const d=parseD(s); const t=new Date(d); t.setDate(d.getDate()+3-((d.getDay()+6)%7));
  const w1=new Date(t.getFullYear(),0,4);
  const n=1+Math.round(((t-w1)/86400000-3+((w1.getDay()+6)%7))/7);
  return t.getFullYear()+'-W'+pad2(n);
}
function weekStart(s){ const d=parseD(s); return dstr(dOff(-((d.getDay()+6)%7), s)); }
function prettyDate(s){ const d=parseD(s); return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' '+d.getDate(); }

}
