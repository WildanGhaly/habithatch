/* Replays SEED_DAYS of days through the real rules: the same coin
   formula, the same decay, the same streak logic. The arc is deliberate:
   a wobbly first fortnight, a slump around week six, then a strong finish. */
function simulateHistory(st){
  const r=rng(20260801);
  const reliability={1:.95,2:.88,3:.86,4:.90,5:.96,6:.82};
  let health=100, streak=0, best=0, lifetime=0, allClearCount=0;
  const owned={};
  let bank=0;
  for(let i=SEED_DAYS;i>=1;i--){
    const d=dstrOff(-i);
    const progress=(SEED_DAYS-i)/SEED_DAYS;
    const warmup = i>SEED_DAYS-12 ? .72 : 1;            // first ~12 days finding the rhythm
    const slump  = (i<=16 && i>=7)  ? .18 : 1;          // a rough week and a half, then the comeback
    const peak   = (i<=36 && i>=26);                    // the personal-best run, before the slump
    const finish = i<=6;                                // the comeback: six clean days
    let checkCoins=0, dueN=0, doneN=0;
    st.habits.forEach(h=>{
      if(daysBetween(h.created,d)<0) return;
      if(!isDue(h,d,st)) return;
      dueN++;
      const rel=Math.min(.985,(reliability[h.id]||.85)+progress*.08)*warmup*slump;
      if(finish || peak || r()<rel){
        const core=5+Math.min(Math.floor(h.cur/3),5)+(h.sched==='daily'?1:0);
        const extra=(owned.sprout?1:0)+Math.round(core*(health>=75?.25:health>=45?.10:0))
                    +Math.round(core*(owned.orchard?.20:0));
        const c=core+extra;
        h.logs[d]='done'; h.rec[d]={c, hp:0};
        h.cur+=1; h.best=Math.max(h.best,h.cur); h.coins+=c;
        checkCoins+=c; doneN++; st.stats.checkoffs++;
      } else {
        h.cur=0;
      }
    });
    const ac = dueN>0 && doneN>=dueN;
    let bonus=0;
    if(ac){
      bonus=Math.round((15+Math.min(streak,30))*(1+(owned.berry?.10:0)+(owned.orchard?.20:0)));
      streak+=1; best=Math.max(best,streak);
      allClearCount++;
      if(allClearCount===3 && !st.pet.hatchedOn) st.pet.hatchedOn=d;
    } else if(dueN>0){ streak=0; }
    st.stats.src.check+=checkCoins; st.stats.src.clear+=bonus;
    const dayCoins=checkCoins+bonus;
    lifetime+=dayCoins; bank+=dayCoins;
    if(dueN>0){
      const decay=Math.max(6, 12-(owned.can?2:0)-(owned.fruit?2:0));
      health=Math.max(0,Math.min(100, health - decay + Math.round(18*doneN/dueN)));
    }
    if(health>=75) st.stats.healthy++; else st.stats.healthy=0;
    st.stats.bestHealthy=Math.max(st.stats.bestHealthy,st.stats.healthy);
    st.history[d]={due:dueN, done:doneN, ac:ac?1:0, paid:ac?1:0, coins:dayCoins, h:health};
    // the fox is adopted early, then the garden is planted as coins allow
    if(!owned._fox && bank>1000){ owned._fox=1; bank-=600; st.stats.spent.species+=600; }
    if(!owned._c1  && bank>500){ owned._c1=1;  bank-=80;  st.stats.spent.clothes+=80; }
    if(!owned._c2  && bank>700){ owned._c2=1;  bank-=150; st.stats.spent.clothes+=150; }
    if(i%3===0 && bank>120){ bank-=8; st.stats.spent.food+=8; st.stats.mealsFed++; }   // a treat every few days
    const nx=GARDEN.find(g=>!owned[g.id]);
    if(nx && bank-nx.cost>=120){ bank-=nx.cost; owned[nx.id]=1; st.garden.push(nx.id); st.gardenLog[nx.id]=d; st.stats.spent.garden+=nx.cost; }
  }
  // today is live and partly finished
  const t=today();
  const dueNow=st.habits.filter(h=>isDue(h,t,st));
  let todayCoins=0;
  dueNow.slice(0,3).forEach(h=>{
    const core=5+Math.min(Math.floor(h.cur/3),5)+(h.sched==='daily'?1:0);
    const extra=(st.garden.includes('sprout')?1:0)+Math.round(core*(health>=75?.25:health>=45?.10:0));
    h.logs[t]='done'; h.rec[t]={c:core+extra, hp:0}; h.cur+=1; h.best=Math.max(h.best,h.cur);
    h.coins+=core+extra; todayCoins+=core+extra; st.stats.checkoffs++;
  });
  st.stats.src.check+=todayCoins; lifetime+=todayCoins; bank+=todayCoins;
  st.stats.idleCollected=640; st.stats.src.idle=640; bank+=640; lifetime+=640;
  st.stats.src.gift=100;      bank+=100; lifetime+=100;   // a friend redeemed the invite code
  st.profile.freezes=1;
  // one last planting run, keeping a working balance in the wallet
  let nx2=GARDEN.find(g=>!st.garden.includes(g.id));
  while(nx2 && bank-nx2.cost>=340){
    bank-=nx2.cost; st.garden.push(nx2.id); st.gardenLog[nx2.id]=dstrOff(-2); st.stats.spent.garden+=nx2.cost;
    nx2=GARDEN.find(g=>!st.garden.includes(g.id));
  }
  st.profile.coins=Math.round(bank);
  st.profile.lifetimeCoins=Math.round(lifetime);
  st.profile.streak=streak; st.profile.best=Math.max(best,streak);
  st.profile.freezeWeek=isoWeek(t);
  st.pet.health=health;
  if(!st.pet.hatchedOn) st.pet.hatchedOn=dstrOff(-(SEED_DAYS-6));
  st.day=t;
  rollupDay(st,t);
  st.history[t].paid=0;
  S=st; checkAch(true); S=null;
}

/* ============================================================
   SCHEDULING: "is this habit due on this local date?"
   ============================================================ */
function isDue(h,d,st){
  if(h.archived) return false;
  if(h.created && daysBetween(h.created,d)<0) return false;
  if(h.sched==='daily') return true;
  if(h.sched==='weekdays') return (h.days||[]).includes(dow(d));
  if(h.sched==='weekly'){
    if(h.logs[d]==='done') return true;
    return weekDone(h,d) < (h.perWeek||3);
  }
  return true;
}
function weekDone(h,d){
  const ws=weekStart(d); let n=0;
  for(let i=0;i<7;i++){ const k=dstrOff(i,ws); if(k>d) break; if(h.logs[k]==='done') n++; }
  return n;
}
function dueList(d,st){ st=st||S; return st.habits.filter(h=>isDue(h,d,st)).sort((a,b)=>a.id-b.id); }
function doneCount(d,st){ st=st||S; return st.habits.filter(h=>h.logs[d]==='done').length; }
function dayGoal(d,st){ st=st||S; const g=st.profile.dailyGoal; const due=dueList(d,st).length;
  return g>0?Math.min(g,Math.max(1,due)):due; }
function rollupDay(st,d){
  const due=st.habits.filter(h=>isDue(h,d,st)).length;
  const done=st.habits.filter(h=>h.logs[d]==='done').length;
  const g=st.profile.dailyGoal;
  const goal=g>0?Math.min(g,Math.max(1,due)):due;
  const prev=st.history[d]||{};
  st.history[d]=Object.assign({}, prev, {due, done, ac:(due>0 && done>=goal)?1:0});
}

/* ============================================================
   GARDEN PERKS
   ============================================================ */
function planted(id){ return S.garden.includes(id); }
function perks(){
  const p={perCheck:0, cap:0, rate:0, decay:0, allClear:0, all:0, freeze:false};
  GARDEN.forEach(g=>{ if(planted(g.id)){
    p.perCheck+=g.perCheck||0; p.cap+=g.cap||0; p.rate+=g.rate||0; p.decay+=g.decay||0;
    p.allClear+=g.allClear||0; p.all+=g.all||0; if(g.freeze)p.freeze=true;
  }});
  return p;
}
function nextPlot(){ return GARDEN.find(g=>!planted(g.id)); }
function gardenPct(){ return Math.round(S.garden.length/GARDEN.length*100); }

/* ============================================================
   PET
   ============================================================ */
function moodOf(h){
  if(h>=75) return {t:"Happy",   k:"happy",   bonus:.25};
  if(h>=45) return {t:"Content", k:"content", bonus:.10};
  if(h>=20) return {t:"Tired",   k:"tired",   bonus:0};
  return       {t:"Hungry",  k:"hungry",  bonus:0};
}
function bonusPct(){ return Math.round(moodOf(S.pet.health).bonus*100); }
function petStage(){
  const b=Math.max(S.profile.best,S.profile.streak);
  let s=1; for(let i=1;i<STAGE_GATE.length;i++) if(b>=STAGE_GATE[i]) s=i+1;
  return S.pet.hatchState==='hatched'?s:1;
}
function stageName(n){ return STAGES[Math.min(4,Math.max(0,(n||1)-1))]; }
function decayPerDay(){ return Math.max(6, 12 - perks().decay); }
function idleRate(){ return 1*(1+perks().rate); }
function idleCap(){ return 50 + perks().cap; }
function idlePending(){
  if(S.pet.hatchState!=='hatched') return 0;
  const hrs=(Date.now()-S.pet.lastCollect)/3600000;
  return Math.max(0, Math.min(idleCap(), Math.floor(hrs*idleRate())));
}
function idleFull(){ return idlePending()>=idleCap(); }
function collectIdle(){
  const amt=idlePending();
  if(amt<=0){ toast('The jar is still empty. Check back later.'); return; }
  addCoins(amt,'idle'); S.pet.lastCollect=Date.now(); S.stats.idleCollected+=amt;
  toast(`${S.pet.name} foraged ${amt} coins`, ASSETS.coin);
  confetti(); bumpCoins(); save(); renderAll();
}

  {l:86,b:44,s:22,r:-14},{l:29,b:58,s:18,r:0},  {l:69,b:56,s:19,r:-5},
];
function coinPile(){
  const pending=idlePending(); if(pending<=0) return '';
  const n=Math.min(COIN_SPOTS.length, Math.max(1, Math.ceil(pending/4)));

/* ============================================================
   ECONOMY
   ============================================================ */
function coinsForCheck(h){
  const base=5;
  const streakBonus=Math.min(Math.floor(h.cur/3),5);
  const hardBonus=h.sched==='daily'?1:0;
  const core=base+streakBonus+hardBonus;
  const p=perks();
  const extra=p.perCheck + Math.round(core*(moodOf(S.pet.health).bonus + p.all));
  return {core, extra, total:core+extra};
}
function allClearBonus(){
  const p=perks();
  return Math.round((15+Math.min(S.profile.streak,30))*(1+p.allClear+p.all));
}
function addCoins(n,src){
  S.profile.coins=Math.max(0,S.profile.coins+n);
  if(n>0){ S.profile.lifetimeCoins+=n; if(src&&S.stats.src[src]!=null) S.stats.src[src]+=n; }
}
function spendCoins(n,bucket){
  S.profile.coins=Math.max(0,S.profile.coins-n);
  if(bucket&&S.stats.spent[bucket]!=null) S.stats.spent[bucket]+=n;
}
/* an exact reversal: coins, lifetime totals and source buckets all unwind */
function refundCoins(n,src){
  S.profile.coins=Math.max(0,S.profile.coins-n);
  S.profile.lifetimeCoins=Math.max(0,S.profile.lifetimeCoins-n);
  if(src&&S.stats.src[src]!=null) S.stats.src[src]=Math.max(0,S.stats.src[src]-n);
}

/* ============================================================
   THE CORE ACTION: check off a habit
   Every grant is written to h.rec[date] so undo returns the exact
   amount. Checking and unchecking in a loop nets to zero.
   ============================================================ */
function toggleHabit(id,ev){
  const t=today(); const h=S.habits.find(x=>x.id===id); if(!h) return;

  if(h.logs[t]==='done'){ uncheckHabit(h,t); return; }

  /* if this habit was checked and then undone today, replay the original
     grant so a check/uncheck loop can never drift the wallet */
  const voided=h.void && h.void[t];
  let total, hp;
  if(voided){ total=voided.c; hp=Math.min(voided.hp, 100-S.pet.health); delete h.void[t]; }
  else{
    const gain=coinsForCheck(h);
    const due=Math.max(1,dueList(t).length);
    const hpWant=(S.pet.hatchState==='hatched')?Math.round(18/due):0;
    total=gain.total; hp=Math.min(hpWant, 100-S.pet.health);
  }
  h.logs[t]='done'; h.cur+=1; h.best=Math.max(h.best,h.cur);
  h.coins+=total; h.rec[t]={c:total, hp};
  S.stats.checkoffs++;
  addCoins(total,'check');
  S.pet.health=Math.min(100, S.pet.health+hp);
  rollupDay(S,t);
  const rc=S.history[t]; rc.coins=(rc.coins||0)+total;
  const gain={total};

  const el=ev&&ev.currentTarget;
  if(el){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); coinFly(el,gain.total); }
  save(); renderAll();
  toast(`+${gain.total} coins for ${esc(h.name)}`, ASSETS.coin);
  bumpCoins(); checkAch();
  setTimeout(()=>maybeAllClear(), 620);
}
function uncheckHabit(h,t){
  const rec=h.rec[t]||{c:0,hp:0};
  refundCoins(rec.c,'check');
  h.coins=Math.max(0,h.coins-rec.c);
  S.pet.health=Math.max(0,S.pet.health-(rec.hp||0));
  h.cur=Math.max(0,h.cur-1);
  S.stats.checkoffs=Math.max(0,S.stats.checkoffs-1);
  S.stats.undos++;
  h.void=h.void||{}; h.void[t]={c:rec.c, hp:rec.hp||0};
  delete h.rec[t]; delete h.logs[t];
  const rc0=S.history[t]; if(rc0) rc0.coins=Math.max(0,(rc0.coins||0)-rec.c);
  rollupDay(S,t);
  unpayDay(t);
  save(); renderAll();
  toast(rec.c?`Unchecked. ${rec.c} coins returned.`:'Unchecked.');
}
/* if a day had already paid its all-clear bonus and no longer qualifies,
   take the bonus, the streak day and the hatch step back */
function unpayDay(t){
  const rec=S.history[t]; if(!rec||!rec.paid) return;
  const goal=dayGoal(t);
  if(rec.due>0 && rec.done>=goal) return;
  refundCoins(rec.bonus||0,'clear');
  rec.coins=Math.max(0,(rec.coins||0)-(rec.bonus||0));
  S.profile.streak=Math.max(0,S.profile.streak-1);
  if(S.pet.hatchState!=='hatched' && rec.hatched) S.pet.hatchProgress=Math.max(0,S.pet.hatchProgress-1);
  delete rec.paid; delete rec.bonus; delete rec.hatched;
}

function maybeAllClear(){
  const t=today();
  const due=dueList(t); const done=doneCount(t); const goal=dayGoal(t);
  if(due.length===0 || done<goal) return;
  if(S.history[t] && S.history[t].paid) return;
  const bonus=allClearBonus();
  addCoins(bonus,'clear');
  S.profile.streak+=1;
  S.profile.best=Math.max(S.profile.best,S.profile.streak);
  rollupDay(S,t);
  const rec=S.history[t];
  rec.paid=1; rec.bonus=bonus; rec.coins=(rec.coins||0)+bonus;
  let hatched=false;
  if(S.pet.hatchState!=='hatched'){
    S.pet.hatchProgress=Math.min(3,S.pet.hatchProgress+1); rec.hatched=1;
    if(S.pet.hatchProgress>=3) hatched=true;
  }
  save();
  if(hatched){ renderAll(); setTimeout(()=>startHatch(), 400); return; }
  showReward({
    title:"Day complete",
    sub:`Everything due today is done. Streak is now ${S.profile.streak} days.`,
    icon:ic('trophy',52),
    coins:bonus,
    right:{v:`${S.profile.streak}`, l:'Day streak'},
    note: S.pet.hatchState==='hatched'
      ? `${esc(S.pet.name)} is fed and your streak is safe.`
      : `The egg is warmer. ${3-S.pet.hatchProgress} more all-clear ${3-S.pet.hatchProgress===1?'day':'days'} to go.`,
    goal: nextPlot()? `${money(S.profile.coins)} of ${money(nextPlot().cost)} coins toward ${nextPlot().name}` : 'Your garden is fully grown'
  });
  renderAll(); checkAch();
}

/* ============================================================
   DAILY ROLLOVER: deterministic, replay-safe, runs on every load
   ============================================================ */
function rollover(){
  const t=today();
  if(S.day===t) return 0;
  let cursor=S.day, moved=0, guard=0;
  while(cursor<t && guard++<400){
    const d=cursor;
    rollupDay(S,d);
    const rec=S.history[d]||{due:0,done:0,ac:0};
    if(rec.due>0){
      if(rec.ac){ if(!rec.paid){ S.profile.streak+=1; S.profile.best=Math.max(S.profile.best,S.profile.streak); rec.paid=1;
                                 if(S.pet.hatchState!=='hatched') S.pet.hatchProgress=Math.min(3,S.pet.hatchProgress+1); } }
      else if(S.profile.freezes>0 && S.profile.streak>0){ S.profile.freezes-=1; S.stats.freezesUsed++; rec.frozen=1; S.frozeYesterday=d; }
      else S.profile.streak=0;
      S.habits.forEach(h=>{
        if(!isDue(h,d,S)) return;
        if(h.logs[d]==='done') return;
        if(rec.frozen){ h.logs[d]='frozen'; return; }
        h.cur=0;
      });
      if(S.pet.hatchState==='hatched'){
        const restore=Math.round(18*rec.done/rec.due);
        S.pet.health=Math.max(0, Math.min(100, S.pet.health - decayPerDay() + restore));
        if(S.pet.health>=75) S.stats.healthy++; else S.stats.healthy=0;
        S.stats.bestHealthy=Math.max(S.stats.bestHealthy,S.stats.healthy);
      }
      rec.h=S.pet.health;
    }
    cursor=dstrOff(1,cursor); moved++;
    if(perks().freeze && isoWeek(cursor)!==S.profile.freezeWeek){
      S.profile.freezes=Math.min(3,S.profile.freezes+1); S.profile.freezeWeek=isoWeek(cursor);
    }
  }
  S.day=t; rollupDay(S,t);
  if(S.pet.hatchState!=='hatched' && S.pet.hatchProgress>=3) S.pet.seenHatch=false;
  save();
  return moved;
}

/* ============================================================
   ACHIEVEMENTS
   ============================================================ */
function achProg(id){
  const P=S.profile;
  const maxDone=Math.max(0,...Object.values(S.history).map(r=>r.done||0),0);
  const map={
    week:[Math.max(P.streak,P.best),7], iron:[Math.max(P.streak,P.best),30], centurion:[Math.max(P.streak,P.best),100],
    perfect:[bestPerfectRun(),7], stacker:[maxDone,5], comeback:[bestComeback(),7],
    wellfed:[Math.max(S.stats.healthy,S.stats.bestHealthy),10],
    bloom:[S.garden.length,GARDEN.length], farmer:[P.lifetimeCoins,10000],
  };
  return map[id]||null;
}
function streakRuns(){
  const days=Object.keys(S.history).filter(k=>S.history[k].due>0).sort();
  const runs=[]; let cur=null;
  days.forEach(k=>{
    if(S.history[k].ac){ if(!cur) cur={from:k,to:k,len:1}; else { cur.to=k; cur.len++; } }
    else if(S.history[k].frozen && cur){ cur.to=k; }
    else { if(cur) runs.push(cur); cur=null; }
  });
  if(cur) runs.push(cur);
  return runs.sort((a,b)=>b.len-a.len);
}
function bestPerfectRun(){ const r=streakRuns(); return r.length?r[0].len:0; }
/* the longest run built after an earlier one had already been broken */
function bestComeback(){
  const r=streakRuns().slice().sort((a,b)=>a.from<b.from?-1:1);
  return r.length>1 ? Math.max(...r.slice(1).map(x=>x.len)) : 0;
}
function achMet(id){
  const p=achProg(id); if(p) return p[0]>=p[1];
  switch(id){
    case 'first_crack': return S.stats.checkoffs>=1;
    case 'alive':       return S.pet.hatchState==='hatched';
    case 'green_thumb': return S.garden.length>=1;
  }
  return false;
}
let achQueue=[];
function checkAch(silent){
  ACHIEVEMENTS.forEach(a=>{
    if(!S.achievements.includes(a.id) && achMet(a.id)){
      S.achievements.push(a.id);
      S.achLog[a.id]=today();
      if(!silent) achQueue.push(a);
    }
  });
  if(achQueue.length && !rewardOpen()) setTimeout(drainAch,760);
  save();
}
function drainAch(){
  if(!achQueue.length || rewardOpen()) return;
  const a=achQueue.shift();
  showReward({
    title:"Badge unlocked",
    sub:a.name,
    icon:a.art?`<div class="fit" style="height:56px">${ART[a.art]}</div>`:(a.img?`<img src="${ASSETS[a.img]}" style="width:52px;height:52px;object-fit:contain;margin:0 auto">`:ic(a.ic,52)),
    stars:a.rar,
    note:a.desc,
    goal:`${S.achievements.length} of ${ACHIEVEMENTS.length} badges collected`
  });
}

function coinFly(fromEl,amount){
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const dev=$('device'), target=document.querySelector('.coinpill');
  if(!target) return;
  const a=fromEl.getBoundingClientRect(), b=target.getBoundingClientRect(), d=dev.getBoundingClientRect();
  const n=Math.min(8,Math.max(3,Math.round(amount/2)));
  for(let i=0;i<n;i++){
    const s=document.createElement('img'); s.src=ASSETS.coin;
    s.style.cssText=`position:absolute;width:22px;height:22px;z-index:78;pointer-events:none;left:${a.left-d.left+a.width/2-11}px;top:${a.top-d.top+a.height/2-11}px;transition:transform .6s cubic-bezier(.4,0,.3,1),opacity .6s;`;
    dev.appendChild(s);
    const dx=(b.left-d.left+b.width/2-11)-(a.left-d.left+a.width/2-11);
    const dy=(b.top-d.top+b.height/2-11)-(a.top-d.top+a.height/2-11);
    const jx=(Math.random()-.5)*70, jy=-30-Math.random()*40;
    requestAnimationFrame(()=>{ s.style.transform=`translate(${jx}px,${jy}px) scale(1.15)`; });
    setTimeout(()=>{ s.style.transitionDuration='.5s'; s.style.transform=`translate(${dx}px,${dy}px) scale(.55)`; s.style.opacity='.2'; }, 170+i*38);
    setTimeout(()=>s.remove(), 900+i*38);
  }
}

function schedLabel(h){
  if(h.sched==='daily') return 'Every day';
  if(h.sched==='weekdays'){
    const d=(h.days||[]).slice().sort();
    if(d.join()==='1,2,3,4,5') return 'Weekdays';
    if(d.join()==='0,6') return 'Weekends';
    return d.map(x=>WD[x]).join(', ');
  }
  return `${h.perWeek||3}× a week`;
}
function habitBox(h,done){
  if(done) return `<button class="hbox" onclick="toggleHabit(${h.id},event)" aria-label="Undo ${esc(h.name)}">${ART.habitCheck}</button>`;
  const tier=h.cur%3, pct=tier/3;
  const C=2*Math.PI*38;
  return `<button class="hbox" onclick="toggleHabit(${h.id},event)" aria-label="Complete ${esc(h.name)}">
    <svg viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="38" fill="none" stroke="#EFE6D6" stroke-width="11"/>

        stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-pct)).toFixed(1)}" transform="rotate(-90 50 50)"/>

      <path d="M39 51 L47 59 L62 41" fill="none" stroke="#DCCDB4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

}

/* One rounded segment per habit due today. An untouched day then reads as a
   plan with six things in it, instead of one empty circle. Falls back to a
   plain arc once there are too many habits for segments to stay legible. */
function ringSVG(size,pct,stroke,total,done){
  const r=size/2-6, c=size/2, C=2*Math.PI*r;
  const col=stroke||'var(--teal)';
  if(total>1 && total<=10){
    const gap=total<=8?16:11, step=360/total, arc=step-gap;
    const pt=deg=>{ const a=(deg-90)*Math.PI/180;
      return `${(c+r*Math.cos(a)).toFixed(2)} ${(c+r*Math.sin(a)).toFixed(2)}`; };
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      ${Array.from({length:total},(_,i)=>{
        const a0=i*step+gap/2;
        return `<path d="M ${pt(a0)} A ${r} ${r} 0 0 1 ${pt(a0+arc)}" fill="none" stroke-width="8" stroke-linecap="round"
          stroke="${i<done?col:'var(--line)'}"/>`;}).join('')}
    </svg>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/>
    ${pct>0?`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-pct)).toFixed(1)}" transform="rotate(-90 ${c} ${c})"/>`:''}
  </svg>`;
}

function nextDueDay(){
  const live=S.habits.filter(h=>!h.archived);
  if(!live.length) return null;
  for(let i=1;i<=7;i++){
    const k=dstrOff(i);
    if(live.some(h=>isDue(h,k,S))) return i===1?'tomorrow':WD[dow(k)];
  }
  return null;
}

function quickStart(cat){
  const t=STARTER[cat]||{name:catOf(cat).name, sched:'daily'};
  const h=newHabit(Object.assign({id:S.nextId++, cat}, t));
  S.habits.push(h); rollupDay(S,today()); save(); renderAll(); checkAch();
  toast(`"${esc(h.name)}" added`);

function completionPct(days){
  let due=0,done=0;
  for(let i=days-1;i>=0;i--){ const k=dstrOff(-i); const r=S.history[k]; if(!r) continue; due+=r.due; done+=r.done; }
  return due?Math.round(done/due*100):0;
}
function weekCard(){
  const ws=weekStart(today());
  const cells=[];
  let total=0;
  for(let i=0;i<7;i++){
    const k=dstrOff(i,ws);
    const r=S.history[k]||{due:0,done:0,ac:0};
    const future=k>today();
    const pct=r.due?Math.round(r.done/r.due*100):0;
    total+=r.done;
    cells.push({k,pct,future,ac:r.ac,due:r.due,today:k===today()});
  }
  return `<div class="card wkcard" onclick="openInsights()">
    <div class="row spread">
      <div><div class="muted" style="font-size:12px;font-weight:700">Habits kept this week</div>

    </div>

      <div class="wkcol">

      </div>`).join('')}</div>
    <div class="wksub">${weekBlurb(cells)}</div>

}
function weekBlurb(cells){
  const past=cells.filter(c=>!c.future && c.due>0);
  if(!past.length) return 'A fresh week. Tap for the full breakdown.';
  const best=past.reduce((a,b)=>b.pct>a.pct?b:a);
  const avg=Math.round(past.reduce((a,b)=>a+b.pct,0)/past.length);
  return `${WD[dow(best.k)]} was your strongest day. You're averaging ${avg}% of what's due. Tap for the full breakdown.`;
}

function manageRow(h,d){
  const idx=S.habits.indexOf(h);
  const live=S.habits.filter(x=>!x.archived);
  const li=live.indexOf(h);
  const dots=[];
  const ws=weekStart(d);
  for(let i=0;i<7;i++){

    const dueDay=isDue(h,k,S), st=h.logs[k];
    const future=k>d;
    let cls = !dueDay?'na' : st==='done'?'on' : (!future&&!st)?'miss':'na';
    if(future && dueDay) cls='';
    dots.push(`<i class="${cls} ${k===d?'today':''}">${st==='done'?`<span>${WD1[(i+1)%7]}</span>`:''}</i>`);
  }
  return `<div class="habit ${h.archived?'done':''}" style="align-items:flex-start">

      <button class="sortbtn" ${li<=0||h.archived?'disabled':''} onclick="moveHabit(${h.id},-1)" aria-label="Move up">${ic('chevU',15)}</button>
      <button class="sortbtn" ${li<0||li>=live.length-1||h.archived?'disabled':''} onclick="moveHabit(${h.id},1)" aria-label="Move down">${ic('chevD',15)}</button>
      <button class="sortbtn" onclick="openEditor(${h.id})" aria-label="Edit">${ic('edit',15)}</button>
    </div>
  </div>`;
}
function moveHabit(id,dir){
  const i=S.habits.findIndex(h=>h.id===id);
  const j=i+dir;
  if(i<0||j<0||j>=S.habits.length) return;
  const tmp=S.habits[i]; S.habits[i]=S.habits[j]; S.habits[j]=tmp;
  // ids drive ordering elsewhere, so swap them too
  const a=S.habits[i].id; S.habits[i].id=S.habits[j].id; S.habits[j].id=a;
  save(); renderHabits();
}

const HOURS=Array.from({length:24},(_,i)=>String(i).padStart(2,'0'));

function edTime(v){ ed.remind=v||''; if(!v) ed._pick=false; refreshEditor(); }

  ed._pick=!ed._pick;

}
function setTimePart(i,v){
  const p=curTime(); p[i]=v; ed.remind=p[0]+':'+p[1];

/* centre each wheel on its selected value after every render */
function syncTimeWheels(){
  ['twH','twM'].forEach(id=>{
    const w=$(id); if(!w) return;
    const on=w.querySelector('.ti.on'); if(!on) return;
    w.scrollTop = on.offsetTop - w.clientHeight/2 + on.offsetHeight/2;
  });

function edDay(d){
  ed.days=ed.days||[];
  const i=ed.days.indexOf(d);
  if(i>=0){ if(ed.days.length<=1){ toast('Pick at least one day'); return;} ed.days.splice(i,1);} else ed.days.push(d);

function refreshEditor(){
  const host=document.querySelector('#dialogHost .dialog');
  if(!host) return;
  const sc=host.scrollTop;
  const focused=document.activeElement && document.activeElement.id==='edName';
  const cursor=focused?document.activeElement.selectionStart:null;
  host.innerHTML=editorHTML();
  host.scrollTop=sc;
  syncTimeWheels();
  if(focused){ const i=$('edName'); if(i){ i.focus(); try{i.setSelectionRange(cursor,cursor);}catch(e){} } }

function equip(id){
  if(id!==0 && !S.pet.ownedClothes.includes(id)){ toast('Buy this outfit first'); return; }
  const was=S.pet.clothesId;
  S.pet.clothesId=(was===id?0:id);

}

/* ---------- FEED sheet ---------- */
function openFeed(){
  if(S.pet.hatchState!=='hatched'){ toast('Your egg does not eat. Keep habits to warm it.'); return; }
  if(S.pet.health>=100){ toast(`${S.pet.name} is completely full`); return; }
  renderFeed();
}
function renderFeed(){
  const anyFood=FOODS.some(f=>(S.pet.food[f.id]||0)>0);
  const items=FOODS.map(f=>{
    const qty=S.pet.food[f.id]||0;
    return `<button class="fooditem ${qty<=0?'empty':''}" onclick="feed(${f.id})">
      ${qty>0?`<span class="fq">×${qty}</span>`:''}
      <img src="${ASSETS[f.img]}"><div class="fn">${f.name}</div><div class="fh">+${f.heal}</div></button>`;
  }).join('');
  const best=FOODS.filter(f=>(S.pet.food[f.id]||0)>0).sort((a,b)=>b.heal-a.heal)[0];
  const add=best?Math.min(best.heal,100-S.pet.health):0;
  const html=`<div class="grip"></div>
    <h3>Feed ${esc(S.pet.name)}</h3>
    <p class="d-sub">Health ${S.pet.health}/100 · ${moodOf(S.pet.health).t} · check-off bonus +${bonusPct()}%</p>
    ${anyFood?`<div class="feedgrid">${items}</div>
      <div class="healthprev">
        <span>${ic('heart',15)}</span>
        <div class="pbar"><div class="pnow" style="width:${S.pet.health}%"></div><div class="padd" style="left:${S.pet.health}%;width:${add}%"></div></div>
        <span>${S.pet.health} → ${S.pet.health+add}</span>
      </div>`
      :`<div class="empty" style="padding:14px"><div class="em-ic">${ic('bag',34)}</div>
         <div class="em-t">The pantry is empty</div><div class="em-s">Grab a treat from the shop, or just keep your habits, which heals for free.</div></div>`}
    <div class="d-actions">
      <button class="btn ghost block" onclick="closeDialog()">Close</button>
      <button class="btn block" onclick="closeDialog();openShop('food')">Buy food</button>
    </div>`;
  const host=document.querySelector('#dialogHost .dialog');
  if(host) host.innerHTML=html; else openDialog(html);
}
function feed(id){
  const f=FOODS.find(x=>x.id===id); const qty=S.pet.food[id]||0;
  if(qty<=0) return;
  if(S.pet.health>=100){ toast('Already full'); return; }
  const before=bonusPct();
  const gained=Math.min(f.heal,100-S.pet.health);
  S.pet.health+=gained; S.pet.food[id]=qty-1; S.stats.mealsFed++;
  const after=bonusPct();
  save();
  toast(after>before?`+${gained} health · bonus now +${after}%`:`+${gained} health`, ASSETS[f.img]);
  const el=document.querySelector('.petart'); if(el){ el.classList.remove('cheer'); void el.offsetWidth; el.classList.add('cheer'); }
  if(S.pet.health>=100){ closeDialog(); } else renderFeed();
  renderAll(); checkAch();
}

/* ============================================================
   HABIT GARDEN (the Journey reframe)

function renderGarden(){
  const nx=nextPlot(), pct=gardenPct();
  const sp=spec(S.pet.species);
  const rows=GARDEN.map(g=>{
    const owned=planted(g.id);
    const isNext=nx && nx.id===g.id;
    const afford=S.profile.coins>=g.cost;
    let right;
    if(owned) right=`<span class="jdone">${ic('check',16)}</span>`;
    else if(isNext) right=`<button class="jbuild ${afford?'':'off'}" onclick="plant('${g.id}')"><img src="${ASSETS.coin}" class="coinmini">${money(g.cost)}</button>`;
    else right=`<span class="jlock"><img src="${ASSETS.coin}" class="coinmini">${money(g.cost)}</span>`;
    return `<div class="jrow ${owned?'owned':isNext?'next':'locked'}">
      <div class="jic">${owned?`<div class="fit" style="height:34px">${ART[g.art]}</div>`:(isNext?ic(g.ic||'sprout',24):`<img src="${ASSETS.lock}">`)}</div>
      <div class="jmain">
        <div class="jname">${g.name}${g.final?' <span class="jfinal">goal</span>':''}</div>
        <div class="jdesc">${g.desc}</div>
        <div class="jperk">${ic('bolt',11)} ${g.perk}</div>
      </div>
      ${right}
    </div>`;
  }).join('');
  const grown=GARDEN.filter(g=>planted(g.id));
  /* one evolving landscape: the most recent growth up front, the next plot ghosted behind */
  const stack=[];
  const H=[74,112,92,132,84];
  if(planted('orchard')) stack.push({art:'gOrchard',h:158,ghost:false});
  grown.filter(g=>g.id!=='orchard').slice(-4).forEach((g,i)=>stack.push({art:g.art,h:H[i%H.length],ghost:false}));
  if(nx) stack.push({art:nx.art,h:78,ghost:true});
  if(!stack.length) stack.push({art:'gSprout',h:70,ghost:true},{art:'gTree',h:88,ghost:true});
  const scene=stack.map(s=>`<div class="gplant ${s.ghost?'p0':''}" style="height:${s.h}px">${ART[s.art]}</div>`).join('');
  const h=`
  <div class="topbar">
    <button class="hi-av" onclick="openProfile()">${avatarImg(44)}</button>
    <div class="hello" style="flex:1"><div class="k">${grown.length} of ${GARDEN.length} plots grown</div><div class="n">Habit Garden</div></div>
    <span class="coinpill"><img src="${ASSETS.coin}">${money(S.profile.coins)}</span>
  </div>
  <div class="gardenhero">
    <div class="gardensun"></div>
    <div class="gardencloud" style="top:34px;width:52px;animation-delay:-4s"></div>
    <div class="gardencloud" style="top:62px;width:38px;animation-duration:30s;animation-delay:-14s;opacity:.7"></div>
    <div class="gardenground g2"></div>
    <div class="gardenground"></div>
    <div class="gardenscene">${scene}</div>
  </div>
  <div class="pad" style="padding-top:14px">
    <div class="jhero">
      <div class="jheropet fit">${S.pet.hatchState==='hatched'
        ? (sp.kind==='svg'?ART[sp.art]:`<img src="${ASSETS[sp.img]}">`)
        : (S.pet.hatchProgress>=1?ART.eggCrack:ART.eggWhole)}</div>
      <div style="min-width:0">
        <div class="jherolabel">${nx?'The long game':'Complete'}</div>
        <div class="jheroh">${nx?`Grow ${esc(S.pet.hatchState==='hatched'?(S.pet.name||'your companion'):'your companion')} a real garden`:`The garden is in full bloom`}</div>
        <div class="jherosub">Coins from your habits plant permanent perks here. Nothing in the garden ever wilts.</div>
      </div>
    </div>
    <div class="jprog">
      <div class="jprogbar"><div class="jprogfill" style="width:${pct}%"></div></div>
      <div class="jprogmeta"><span>Garden ${pct}% grown</span><span>${grown.length} / ${GARDEN.length}</span></div>
    </div>
    ${nx?`<div class="card" style="padding:14px 16px;margin-bottom:14px">
      <div class="row spread"><div style="min-width:0">
        <div class="jcardh">Next: ${nx.name}</div>
        <div class="jcards">${nx.perk} · ${money(Math.max(0,nx.cost-S.profile.coins))>0?`${money(Math.max(0,nx.cost-S.profile.coins))} coins to go`:'you can afford it now'}</div>
      </div></div>
      <div class="jprogbar" style="margin-top:11px"><div class="jprogfill" style="width:${Math.min(100,Math.round(S.profile.coins/nx.cost*100))}%"></div></div>
      <button class="btn block ${S.profile.coins>=nx.cost?'':'ghost'}" style="margin-top:12px" onclick="plant('${nx.id}')">
        <img src="${ASSETS.coin}" class="coinmini">${S.profile.coins>=nx.cost?`Plant ${nx.name} for ${money(nx.cost)}`:`${nx.name} needs ${money(nx.cost)} coins`}</button>
    </div>`:''}
    <div class="shead"><h3>Plots</h3><span class="muted" style="font-size:12px;font-weight:700">perks are permanent</span></div>
    ${rows}
    <div class="growthnote">${ic('sparkle',13)} Every perk here is buyable with coins you earn for free. HabitHatch+ only ever adds decoration, never an advantage.</div>
  </div>`;
  $('tabGarden').innerHTML=h;
}
function plant(id){
  const g=GARDEN.find(x=>x.id===id); if(!g||planted(id)) return;
  if(S.profile.coins<g.cost){
    toast(`${money(g.cost-S.profile.coins)} more coins to go`);
    return;
  }
  openDialog(`<div class="grip"></div>
    <div class="fit" style="height:110px;margin-bottom:10px">${ART[g.art]}</div>
    <h3>Plant ${g.name}?</h3>
    <p class="d-sub">${g.desc}</p>
    <div class="d-line"><span class="lbl">Perk</span><span class="val" style="font-size:13px">${g.perk}</span></div>
    <div class="d-line"><span class="lbl">Cost</span><span class="val"><img src="${ASSETS.coin}">${money(g.cost)}</span></div>
    <div class="d-line"><span class="lbl">Your balance</span><span class="val"><img src="${ASSETS.coin}">${money(S.profile.coins)}</span></div>
    <div class="d-actions"><button class="btn ghost block" onclick="closeDialog()">Not yet</button>
    <button class="btn block" onclick="doPlant('${g.id}')">Plant it</button></div>`);
}
function doPlant(id){
  const g=GARDEN.find(x=>x.id===id); if(!g||planted(id)) return;
  if(S.profile.coins<g.cost){ closeDialog(); toast('Not enough coins'); return; }
  spendCoins(g.cost,"garden"); S.garden.push(id); S.gardenLog[id]=today();
  if(g.freeze && S.profile.freezes<1){ S.profile.freezes=1; S.profile.freezeWeek=isoWeek(today()); }
  closeDialog(); save(); renderAll(); confetti(); bumpCoins();
  showReward({
    title:"Planted!",
    sub:g.name,
    icon:`<div class="fit" style="height:110px">${ART[g.art]}</div>`,
    note:`${g.perk}, permanently.`,
    goal: nextPlot()? `Next up: ${nextPlot().name} · ${money(nextPlot().cost)} coins` : 'Your garden is complete'
  });
  checkAch();
}

let curShop='food';
function openShop(tab){
  curShop=tab||'food';
  $('shopTabs').innerHTML=`
    <button data-shop="food" onclick="shopTab('food')"><img src="${ASSETS.foodIcon}">Food</button>
    <button data-shop="pets" onclick="shopTab('pets')"><img src="${ASSETS.petIcon}">Companions</button>
    <button data-shop="clothes" onclick="shopTab('clothes')"><img src="${ASSETS.wardrobe}">Wardrobe</button>`;
  openScreen('shop'); shopTab(curShop);
}
function closeShop(){ closeSlide('shop',()=>renderAll()); }
function syncShopCoins(){ const el=$('shopCoins'); if(el) el.innerHTML=`<img src="${ASSETS.coin}">${money(S.profile.coins)}`; }
function shopTab(t){
  curShop=t||'food';
  document.querySelectorAll('[data-shop]').forEach(b=>b.classList.toggle('on',b.dataset.shop===curShop));
  const g=$('shopGrid'); if(!g) return;
  if(curShop==='food'){
    g.innerHTML=FOODS.map(f=>{
      const qty=S.pet.food[f.id]||0;
      return shopCard({img:ASSETS[f.img], name:f.name, desc:`+${f.heal} health`, price:f.price, premium:f.premium,
        action:`buyFood(${f.id})`, extra: qty>0?`<span class="qty">×${qty}</span>`:''});
    }).join('');
  } else if(curShop==='pets'){
    g.innerHTML=SPECIES.map(s=>{
      const owned=S.pet.ownedSpecies.includes(s.id);
      const active=S.pet.species===s.id;
      const art=s.kind==='svg'?`<div class="artsvg">${ART[s.art]}</div>`:null;
      if(owned) return shopCard({img:s.kind==='svg'?null:ASSETS[s.img], artHTML:art, name:s.name,
        desc:active?'Your companion':'Adopted', price:s.price, premium:s.premium,
        btnClass:active?'equipped':'equip', label:active?'Active':'Switch', action:`switchSpecies('${s.id}')`});
      return shopCard({img:s.kind==='svg'?null:ASSETS[s.img], artHTML:art, name:s.name, desc:s.meta,
        price:priceFor('species',s), premium:s.premium, included:included('species'), action:`buyPet('${s.id}')`});
    }).join('');
  } else {
    g.innerHTML=CLOTHES.map(c=>{
      const owned=S.pet.ownedClothes.includes(c.id);
      const on=S.pet.clothesId===c.id;
      if(owned) return shopCard({img:ASSETS[c.img], name:c.name, desc:'Cosmetic', price:c.price, premium:c.premium,
        btnClass:on?'equipped':'equip', label:on?'Wearing':'Wear', action:`equip(${c.id});shopTab('clothes')`});
      return shopCard({img:ASSETS[c.img], name:c.name, desc:'Cosmetic', price:priceFor('clothes',c), premium:c.premium, included:included('clothes'), action:`buyClothes(${c.id})`});
    }).join('');
  }
  syncShopCoins();
}
/* Companions and the wardrobe are pure cosmetics, so HabitHatch+ includes the
   whole collection from day one. Food stays paid: it touches health, and paying
   must never make the habits easier. */
function priceFor(kind,item){
  return (S.profile.premium && (kind==='species'||kind==='clothes')) ? 0 : item.price;
}
function included(kind){ return S.profile.premium && (kind==='species'||kind==='clothes'); }

function shopCard(o){
  const locked=o.premium && !S.profile.premium;
  let btn;
  if(o.btnClass==='equipped') btn=`<div class="buy equipped" onclick="${o.action}">${ic('check',13)} ${o.label}</div>`;
  else if(o.btnClass==='equip') btn=`<div class="buy equip" onclick="${o.action}">${o.label}</div>`;
  else if(locked) btn=`<button class="buy prem" onclick="${o.action}">${ic('crown',13)} Unlock</button>`;
  else if(o.price===0) btn=`<button class="buy" onclick="${o.action}">${o.included?`${ic('crown',12)} Included`:'Free'}</button>`;
  else btn=`<button class="buy" onclick="${o.action}"><img src="${ASSETS.coin}">${money(o.price)}</button>`;
  return `<div class="shopcard">
    ${locked?`<span class="prembadge">${ic('crown',11)} HabitHatch+</span>`:''}
    ${o.extra||''}
    ${o.artHTML||`<img class="art" src="${o.img}">`}
    <div class="cn">${o.name}</div><div class="cd">${o.desc}</div>
    ${btn}</div>`;
}
let pendingBuy=null;
function tryBuy({img,artHTML,name,price,premium,onOk,bucket}){
  pendingBuy=null;                       // never let an earlier confirmation leak into this one
  if(premium && !S.profile.premium){
    openDialog(buyDialog(img,artHTML,name,price,premium,
      `<div class="d-err">${ic('crown',15)} HabitHatch+ item. Subscribe to unlock it.</div>`,
      `<button class="btn ghost block" onclick="closeDialog()">Not now</button><button class="btn block" onclick="closeDialog();openPremium()">See HabitHatch+</button>`));
    return;
  }
  if(S.profile.coins<price){
    openDialog(buyDialog(img,artHTML,name,price,premium,
      `<div class="d-err">${ic('info',15)} Not enough coins. ${money(price-S.profile.coins)} to go. Check off a few habits.</div>`,
      `<button class="btn ghost block" onclick="closeDialog()">Okay</button>`));
    return;
  }
  openDialog(buyDialog(img,artHTML,name,price,premium,'',
    `<button class="btn ghost block" onclick="closeDialog()">Cancel</button><button class="btn block" onclick="confirmBuy()">Buy now</button>`));
  pendingBuy=()=>{ spendCoins(price,bucket||"food"); onOk(); syncShopCoins(); closeDialog(); save();
    toast(`${name} is yours`, ASSETS.coin); bumpCoins(); renderAll(); checkAch(); };
}
function confirmBuy(){ if(pendingBuy)pendingBuy(); pendingBuy=null; }
function buyDialog(img,artHTML,name,price,premium,err,actions){
  return `<div class="grip"></div>
    ${artHTML?`<div class="fit" style="height:120px;margin-bottom:10px">${artHTML.replace('class="artsvg"','class="fit" style="height:120px"')}</div>`:`<img class="d-art" src="${img}">`}
    <h3>${name}</h3>
    <p class="d-sub">${price===0&&S.profile.premium?'Part of your HabitHatch+ collection':premium?'HabitHatch+ item':'Add it to your collection'}</p>
    ${err}
    <div class="d-line"><span class="lbl">Price</span><span class="val">${price===0
        ? (S.profile.premium?`${ic('crown',13)} Included`:'Free')
        : `<img src="${ASSETS.coin}">${money(price)}`}</span></div>
    <div class="d-line"><span class="lbl">Your balance</span><span class="val"><img src="${ASSETS.coin}">${money(S.profile.coins)}</span></div>
    <div class="d-actions">${actions}</div>`;
}
function buyFood(id){ const f=FOODS.find(x=>x.id===id);
  tryBuy({img:ASSETS[f.img],name:f.name,price:f.price,premium:f.premium,bucket:'food',
    onOk:()=>{ S.pet.food[id]=(S.pet.food[id]||0)+1; shopTab('food'); }}); }
function buyClothes(id){ const c=CLOTHES.find(x=>x.id===id);
  tryBuy({img:ASSETS[c.img],name:c.name,price:priceFor('clothes',c),premium:c.premium,bucket:'clothes',
    onOk:()=>{ if(!S.pet.ownedClothes.includes(id))S.pet.ownedClothes.push(id); S.pet.clothesId=id; S.stats.outfitChanges++; shopTab('clothes'); }}); }
function buyPet(id){ const s=spec(id);
  tryBuy({img:s.kind==='svg'?null:ASSETS[s.img], artHTML:s.kind==='svg'?`<div class="artsvg">${ART[s.art]}</div>`:null,
    name:s.name,price:priceFor('species',s),premium:s.premium,bucket:'species',
    onOk:()=>{ S.pet.ownedSpecies.push(id); shopTab('pets');
      setTimeout(()=>openDialog(`<div class="grip"></div>
        <h3>Switch to your ${s.name.toLowerCase()}?</h3>
        <p class="d-sub">${esc(S.pet.name)} keeps every stat: health, growth stage and wardrobe carry straight over. You can switch back any time.</p>
        <div class="d-actions"><button class="btn ghost block" onclick="closeDialog()">Later</button>
        <button class="btn block" onclick="closeDialog();switchSpecies('${id}')">Switch now</button></div>`),400); }}); }
function switchSpecies(id){
  if(!S.pet.ownedSpecies.includes(id)){ buyPet(id); return; }
  if(S.pet.species===id){ toast(`${S.pet.name} is already your ${spec(id).name.toLowerCase()}`); return; }
  S.pet.species=id; save(); shopTab('pets'); renderAll();
  toast(`${S.pet.name} is a ${spec(id).name.toLowerCase()} now`);
  const el=document.querySelector('.petart'); if(el){ el.classList.add('cheer'); }
}

/* ============================================================
   NURSERY / HATCH: the signature moment
   ============================================================ */
let hatchStep=0, hatchTimers=[];
function startHatch(){
  if(S.pet.hatchState==='hatched') return;
  hatchStep=0; hatchTimers.forEach(clearTimeout); hatchTimers=[];
  openScreen('nursery');
  $('nursSkip').style.display='block';
  renderHatch();
  hatchTimers.push(setTimeout(()=>{ hatchStep=1; renderHatch(); },1500));
  hatchTimers.push(setTimeout(()=>{ hatchStep=2; renderHatch(); },3400));
  hatchTimers.push(setTimeout(()=>{ hatchStep=3; doHatch(); },5300));
}
function hatchSkip(){ hatchTimers.forEach(clearTimeout); hatchTimers=[]; hatchStep=3; doHatch(); }
function renderHatch(){
  const copy=[
    {h:"Something is moving",p:"Three days of showing up. The egg can feel it."},
    {h:"A first crack",p:"Whatever is in there really wants to meet you."},
    {h:"Almost…",p:"Hold on."},
  ][hatchStep]||{h:'',p:''};
  const art=hatchStep===0?ART.eggWhole:hatchStep===1?ART.eggCrack:ART.eggCrack;
  $('nursBody').innerHTML=`
    <div class="nursstage">
      <div class="nursglow ${hatchStep>=2?'on':''}"></div>
      <div class="starburst" id="nursStars">${starField()}</div>
      <div class="nursegg ${hatchStep>=1?'shake':''} ${hatchStep>=2?'burstout':''}">${art}</div>
    </div>
    <div class="nurstxt"><h2>${copy.h}</h2><p>${copy.p}</p></div>`;
}
function starField(){
  const n=14;
  return Array.from({length:n},(_,i)=>{
    const a=(i/n)*Math.PI*2, dist=110+Math.random()*60;
    const art=[ART.star1,ART.star2,ART.star3][i%3];
    return `<i style="--sx:${(Math.cos(a)*dist).toFixed(0)}px;--sy:${(Math.sin(a)*dist).toFixed(0)}px;animation-delay:${(i*0.045).toFixed(2)}s">${art}</i>`;
  }).join('');
}
function doHatch(){
  S.pet.hatchState='hatched';
  S.pet.hatchProgress=3;
  S.pet.hatchedOn=today();
  S.pet.health=100;
  S.pet.lastCollect=Date.now();

/* ============================================================
   CHART PRIMITIVES (inline SVG, no library)
   ============================================================ */
function barsChart(items,o){
  o=o||{};
  const h=(o.height||96)+20;                       // room for the axis labels
  const max=Math.max(1,...items.map(i=>i.v));
  const n=items.length;
  const step=Math.max(1,Math.ceil(n/7));
  return `<div class="wkbars" style="height:${h}px;gap:${n>24?3:n>12?4:6}px">
    ${items.map((it,i)=>{
      const zero=!it.v;
      const pct=zero?0:Math.max(10,Math.round(it.v/max*100));
      const showLabel = i%step===0 || it.now;
      return `<div class="wkcol">
        <div class="wkbar ${it.off?'fut':zero?'miss':''} ${it.hi?'hi':''}" style="height:${pct}%"></div>
        <span class="${it.now?'on':''}">${showLabel?it.label:''}</span></div>`;}).join('')}
  </div>`;
}
function lineChart(vals,o){
  o=o||{};
  const w=340, h=o.height||88, pad=4;
  if(!vals.length) return '';
  const max=Math.max(1,...vals), min=o.zero?0:Math.min(...vals);
  const rng=Math.max(1,max-min);
  const pts=vals.map((v,i)=>[pad+i*((w-pad*2)/Math.max(1,vals.length-1)), h-pad-((v-min)/rng)*(h-pad*2)]);
  let d='';
  pts.forEach((p,i)=>{
    if(i===0){ d+=`M${p[0].toFixed(1)} ${p[1].toFixed(1)}`; return; }
    const q=pts[i-1], cx=(q[0]+p[0])/2;
    d+=` C${cx.toFixed(1)} ${q[1].toFixed(1)} ${cx.toFixed(1)} ${p[1].toFixed(1)} ${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
  });
  const area=d+` L${pts[pts.length-1][0].toFixed(1)} ${h} L${pts[0][0].toFixed(1)} ${h} Z`;
  const col=o.color||'var(--teal)';
  const id='lg'+Math.abs(vals.length*97+Math.round(vals[0]||0));
  return `<svg class="lc" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${o.fill||'#12667F'}" stop-opacity=".28"/>
      <stop offset="1" stop-color="${o.fill||'#12667F'}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.length?`<circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3.6" fill="${col}"/>`:''}
  </svg>`;
}
function donutChart(segs,size){
  const s=size||96, r=s/2-9, C=2*Math.PI*r;
  const total=Math.max(1,segs.reduce((a,b)=>a+b.v,0));
  let off=0;
  const arcs=segs.filter(x=>x.v>0).map(sg=>{
    const frac=sg.v/total, len=C*frac;
    const el=`<circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="${sg.c}" stroke-width="14"
      stroke-dasharray="${len.toFixed(1)} ${(C-len).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 ${s/2} ${s/2})"/>`;
    off+=len; return el;
  }).join('');
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" style="flex:none">
    <circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="#EFE7D6" stroke-width="14"/>${arcs}</svg>`;
}
function gauge(pct,label,sub){
  const C=2*Math.PI*40;
  return `<div style="display:flex;align-items:center;gap:15px">
    <div class="cring" style="flex:none"><svg width="94" height="94" viewBox="0 0 94 94">
      <circle cx="47" cy="47" r="40" fill="none" stroke="#EFE7D6" stroke-width="9"/>
      <circle cx="47" cy="47" r="40" fill="none" stroke="${pct>=75?'#7FA53C':pct>=45?'var(--orange)':'var(--danger)'}" stroke-width="9" stroke-linecap="round"
        stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-pct/100)).toFixed(1)}" transform="rotate(-90 47 47)"/></svg>
      <div class="cringv" style="font-size:22px">${pct}</div></div>
    <div style="min-width:0"><div style="font-weight:800;color:var(--teal-ink);font-size:15px">${label}</div>
      <div style="font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.45;margin-top:3px">${sub}</div></div>
  </div>`;
}
function deltaChip(now,prev,unit,invert){
  if(prev===null||prev===undefined) return '';
  const d=now-prev;
  const cls=d===0?'flat':((d>0)!==!!invert?'up':'down');
  const arrow=d===0?ic('minus',11):(d>0?ic('arrUp',11):ic('arrDn',11));
  const v=Math.abs(Math.round(d*10)/10);
  return `<span class="delta ${cls}">${arrow}${v}${unit||''}</span>`;
}
function statCard(o){

    <div class="sk">${ic(o.ic,13)} ${o.k}</div>

}

/* ============================================================
   ANALYTICS
   ============================================================ */
function firstDay(){ const all=Object.keys(S.history).sort(); return all.length?all[0]:today(); }
function trackedDays(){ return daysBetween(firstDay(),today())+1; }
function hist(n){
  const span = n>0 ? n : trackedDays();
  const out=[];
  for(let i=span-1;i>=0;i--){ const k=dstrOff(-i); out.push({k, r:S.history[k]||{due:0,done:0,ac:0,coins:0}}); }
  return out;
}
function agg(rows){
  let due=0,done=0,ac=0,coins=0,active=0;
  rows.forEach(x=>{ due+=x.r.due||0; done+=x.r.done||0; if(x.r.ac)ac++; coins+=x.r.coins||0; if(x.r.due>0)active++; });
  return {due,done,ac,coins,active, rate:due?Math.round(done/due*100):0, acRate:active?Math.round(ac/active*100):0};
}
function prevAgg(n){
  const span=n>0?n:trackedDays();
  const rows=[];
  for(let i=span*2-1;i>=span;i--){ const k=dstrOff(-i); rows.push({k, r:S.history[k]||{due:0,done:0,ac:0,coins:0}}); }
  return agg(rows);
}
function consistencyScore(rows){
  const a=agg(rows);
  const streakPart=Math.min(1,Math.max(S.profile.streak,0)/21);
  return Math.round(a.rate*0.5 + a.acRate*0.3 + streakPart*100*0.2);
}
function byWeekday(rows){
  const buckets=Array.from({length:7},()=>({due:0,done:0}));
  rows.forEach(x=>{ const w=dow(x.k); buckets[w].due+=x.r.due||0; buckets[w].done+=x.r.done||0; });
  return buckets.map((b,i)=>({i, name:WD[i], pct:b.due?Math.round(b.done/b.due*100):null, due:b.due}));
}
function weeklySeries(weeks){
  const out=[]; let ws=weekStart(today());
  for(let w=weeks-1;w>=0;w--){
    const start=dstrOff(-7*w,ws);
    let due=0,done=0,coins=0,ac=0;
    for(let i=0;i<7;i++){ const k=dstrOff(i,start); const r=S.history[k]; if(!r)continue;
      due+=r.due; done+=r.done; coins+=r.coins||0; if(r.ac)ac++; }
    out.push({start, due, done, coins, ac, pct:due?Math.round(done/due*100):0});
  }
  return out;
}
function habitRate(h,days){
  let due=0,done=0;
  const span=days>0?days:trackedDays();
  for(let i=span-1;i>=0;i--){ const k=dstrOff(-i); if(!isDue(h,k,S))continue; due++; if(h.logs[k]==='done')done++; }
  return {due, done, pct:due?Math.round(done/due*100):0};
}
/* which habit most often stands between you and an all-clear day */
function blocker(days){
  const span=days>0?days:trackedDays();
  const miss={};
  for(let i=span-1;i>=0;i--){
    const k=dstrOff(-i); const r=S.history[k];
    if(!r||!r.due||r.ac) continue;
    S.habits.forEach(h=>{ if(isDue(h,k,S) && h.logs[k]!=='done'){ miss[h.id]=(miss[h.id]||0)+1; } });
  }
  const top=Object.keys(miss).sort((a,b)=>miss[b]-miss[a])[0];
  if(!top) return null;
  const h=S.habits.find(x=>String(x.id)===String(top));
  return h?{h, n:miss[top]}:null;
}
function recoveryDays(){
  const runs=streakRuns().slice().sort((a,b)=>a.from<b.from?-1:1);
  if(runs.length<2) return null;
  let gaps=[];
  for(let i=1;i<runs.length;i++){ gaps.push(Math.max(1,daysBetween(runs[i-1].to,runs[i].from)-1)); }
  return gaps.length?Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length*10)/10:null;
}
function moodDays(days){
  const span=days>0?days:trackedDays();
  const b={happy:0,content:0,tired:0,hungry:0};
  for(let i=span-1;i>=0;i--){ const r=S.history[dstrOff(-i)]; if(!r||r.h==null)continue; b[moodOf(r.h).k]++; }
  return b;
}
function healthSeries(days){
  const out=[];
  for(let i=days-1;i>=0;i--){ const r=S.history[dstrOff(-i)]; if(r&&r.h!=null) out.push(r.h); }
  return out;
}
function bestDayRec(){
  let best=null;
  Object.keys(S.history).forEach(k=>{ const r=S.history[k]; if(!r.due)return;
    if(!best||r.done>best.r.done) best={k,r}; });
  return best;
}
function bestCoinDay(){
  let best=null;
  Object.keys(S.history).forEach(k=>{ const r=S.history[k]; if(!r.coins)return;
    if(!best||r.coins>best.r.coins) best={k,r}; });
  return best;
}
function gardenEta(){
  const nx=nextPlot(); if(!nx) return null;
  const w=weeklySeries(4).filter(x=>x.coins>0);
  const perDay=w.length? w.reduce((a,b)=>a+b.coins,0)/(w.length*7) : 0;
  const need=Math.max(0,nx.cost-S.profile.coins);
  if(perDay<=0) return {nx, days:null};
  return {nx, days:Math.ceil(need/perDay), perDay:Math.round(perDay)};
}

/* ---------- 3. STREAKS ---------- */
function insStreaks(){
  const runs=streakRuns();
  const avg=runs.length?Math.round(runs.reduce((a,b)=>a+b.len,0)/runs.length*10)/10:0;
  const rec=recoveryDays();
  const weeks=8;
  const ws=weekStart(dstrOff(-7*(weeks-1)));
  let cal='';
  for(let w=0;w<weeks;w++){
    let col='';
    for(let dd=0;dd<7;dd++){
      const k=dstrOff(w*7+dd,ws);
      const r=S.history[k];
      const cls=k>today()?'fut':(!r||!r.due)?'':r.frozen?'fz':r.ac?'ac':'p';
      col+=`<div class="caldot ${cls} ${k===today()?'now':''}" title="${k}"></div>`;
    }
    cal+=`<div class="calcol"><div class="calhead">${w===0||w===weeks-1?prettyDate(dstrOff(w*7,ws)).split(' ')[0]:''}</div>${col}</div>`;
  }
  return `
  <div class="sgrid" style="margin-bottom:12px">
    ${statCard({ic:'flame',k:'Current',v:S.profile.streak,unit:'d',s:S.profile.streak?`Started ${prettyDate(dstrOff(-(S.profile.streak-1)))}`:'Not running'})}
    ${statCard({ic:'trophy',k:'Longest',v:S.profile.best,unit:'d',s:`Personal record`})}
    ${statCard({ic:'scale',k:'Average run',v:avg,unit:'d',s:`${runs.length} runs recorded`})}
    ${statCard({ic:'snow',k:'Freezes',v:S.profile.freezes,s:`${S.stats.freezesUsed} used so far`})}
  </div>

  ${panel({ic:'calendar',title:'All-clear calendar',sub:'Eight weeks. Green is a day you cleared everything due.',
    body:`<div class="calwrap">${cal}</div>
      <div class="heatlegend" style="margin-top:10px">
        <span><i class="caldot ac" style="width:11px;height:11px"></i>all-clear</span>
        <span><i class="caldot p" style="width:11px;height:11px"></i>partial</span>
        <span><i class="caldot fz" style="width:11px;height:11px"></i>frozen</span>
        <span><i class="caldot fut" style="width:11px;height:11px"></i>upcoming</span></div>`})}

  ${panel({ic:'medal',title:'Your longest runs',sub:'Every streak you have put together, longest first.',
    locked:true, lockTitle:'Streak history', lockSub:'Keep the full record of every run you have built.',
    body: runs.length? runs.slice(0,6).map((r,i)=>{
        const live=daysBetween(r.to,today())<=0;
        return `<div class="rank">
        <span class="rn ${i===0?'top':''}">${i+1}</span>
        <span class="rmain"><span class="rt">${r.len} day run</span>
          <span class="rs">${prettyDate(r.from)} to ${prettyDate(r.to)}</span></span>
        <span class="rv" style="font-size:11px;color:${live?'var(--orange)':i===0?'#7A4B00':'var(--muted)'}">${live?'running':i===0?'best':''}</span></div>`;}).join('')
      : `<div class="empty" style="padding:14px"><div class="em-s">Clear a full day to start your first run.</div></div>`})}

  ${panel({ic:'repeat',title:'How fast you bounce back',
    sub:'Average days between one streak ending and the next starting.',
    locked:true, lockTitle:'Recovery pattern', lockSub:'The number that predicts whether a habit sticks.',
    body: rec!==null? `<div style="display:flex;align-items:center;gap:16px">
        <div style="flex:none;text-align:center;background:var(--cream);border:1px solid var(--line-2);border-radius:var(--r-md);padding:14px 18px">

function openAchievements(){ renderAchievements(); openScreen('achievements'); }
function renderAchievements(){
  const un=S.achievements;
  const got=ACHIEVEMENTS.filter(a=>un.includes(a.id)).length, total=ACHIEVEMENTS.length;
  const C=2*Math.PI*26;
  const groups=[];
  ACHIEVEMENTS.forEach(a=>{ let g=groups.find(x=>x.name===a.group); if(!g){g={name:a.group,items:[]};groups.push(g);} g.items.push(a); });
  let html=`<div class="pad-flat">
    <div class="achtop">
      <div class="cring"><svg width="66" height="66" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="26" fill="none" stroke="#EFE7D6" stroke-width="7"/>
        <circle cx="32" cy="32" r="26" fill="none" stroke="var(--orange)" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-got/total)).toFixed(1)}" transform="rotate(-90 32 32)"/></svg>
        <div class="cringv" style="font-size:15px">${got}</div></div>
      <div><div class="achtopn">${got} of ${total} badges</div>
      <div class="muted" style="font-size:12px;font-weight:600;line-height:1.4">Earned by showing up, not by spending.</div></div>
    </div>`;
  groups.forEach(g=>{
    const gg=g.items.filter(a=>un.includes(a.id)).length;
    html+=`<div class="shead"><h3>${g.name}</h3><span class="muted" style="font-size:11px;font-weight:700">${gg}/${g.items.length}</span></div><div class="achgrid">`;
    html+=g.items.map(a=>{
      const isGot=un.includes(a.id);
      const icon = a.art?`<div class="fit" style="height:30px">${ART[a.art]}</div>`
                 : a.img?`<img src="${ASSETS[a.img]}" style="width:24px;height:24px;object-fit:contain">`
                 : (isGot?ic(a.ic,24):ic('lock',21));
      let prog='';
      if(!isGot){ const p=achProg(a.id); if(p){ const pc=Math.min(100,Math.round(p[0]/p[1]*100));
        prog=`<div class="achprog"><i style="width:${pc}%"></i></div><div class="achpt">${money(p[0])} / ${money(p[1])}</div>`; } }
      const when=isGot&&S.achLog[a.id]?`<div class="achpt" style="margin-top:6px">${prettyDate(S.achLog[a.id])}</div>`:'';
      return `<div class="achcard ${isGot?'got':'locked'}">
        <div class="achstars">${Array.from({length:a.rar},()=>`<span style="display:inline-flex;width:13px;height:13px;${isGot?'':'filter:grayscale(1);opacity:.5'}">${ART['star'+a.rar]}</span>`).join('')}</div>
        <div class="achic" style="${a.art&&!isGot?'filter:grayscale(1);opacity:.55':''}">${icon}</div>
        <div class="acht">${a.name}</div><div class="achd">${a.desc}</div>${prog}${when}</div>`;
    }).join('');
    html+=`</div>`;
  });
  html+=`</div>`;
  $('achievementsBody').innerHTML=html;
}

function openRecap(){ renderRecap(); openScreen('recap'); }
function weekAgg(offset){
  const ws=dstrOff(-7*offset, weekStart(today()));
  let kept=0,due=0,ac=0,coins=0;
  for(let i=0;i<7;i++){ const r=S.history[dstrOff(i,ws)]; if(!r)continue; kept+=r.done; due+=r.due; if(r.ac)ac++; coins+=r.coins||0; }
  return {ws, kept, due, ac, coins, pct:due?Math.round(kept/due*100):0};
}
function renderRecap(){
  const w=weekAgg(0), pv=weekAgg(1);
  const ws=w.ws;
  const grown=GARDEN.filter(g=>planted(g.id));
  const plantedThisWeek=GARDEN.filter(g=>S.gardenLog[g.id] && daysBetween(ws,S.gardenLog[g.id])>=0);
  const badgesThisWeek=ACHIEVEMENTS.filter(a=>S.achLog[a.id] && daysBetween(ws,S.achLog[a.id])>=0);
  const perHabit=S.habits.filter(h=>!h.archived).map(h=>{
    let d=0,n=0;
    for(let i=0;i<7;i++){ const k=dstrOff(i,ws); if(k>today())break; if(!isDue(h,k,S))continue; n++; if(h.logs[k]==='done')d++; }
    return {h,d,n,pct:n?Math.round(d/n*100):0};
  }).sort((a,b)=>b.pct-a.pct);
  const days=[];
  for(let i=0;i<7;i++){ const k=dstrOff(i,ws); days.push({k, r:S.history[k]||{due:0,done:0,ac:0}, future:k>today()}); }
  const bestDay=days.filter(d=>!d.future&&d.r.due).sort((a,b)=>(b.r.done/b.r.due)-(a.r.done/a.r.due))[0];
  const hadLast = pv.due>0;
  const verdict = !hadLast ? "Your first week on the board."
    : w.pct>pv.pct+5?"Ahead of last week." : w.pct>=pv.pct-5?"About level with last week." : "A lighter week than the last one.";
  if(!w.due && !w.kept){
    $('recapBody').innerHTML=`<div class="pad-flat"><div class="empty" style="padding:52px 22px">
      <div class="em-ic">${ic('gift',44)}</div>
      <div class="em-t">No recap for this week yet</div>
      <div class="em-s">${S.habits.filter(h=>!h.archived).length
        ? 'Nothing has been due yet this week. Your card fills in<br>as the days go by, and it is worth sharing by Sunday.'

      <button class="btn sm" style="margin-top:16px" onclick="closeScreen('recap');setTimeout(()=>switchTab('today'),240)">

  }
  $('recapBody').innerHTML=`<div class="pad-flat">
    <div class="recapcard">
      <div style="font-size:11px;font-weight:800;color:#BFE3F3;letter-spacing:.5px;text-transform:uppercase;position:relative;z-index:2">
        ${prettyDate(ws)} to ${prettyDate(dstrOff(6,ws))}</div>
      <div style="font-size:23px;font-weight:800;margin-top:4px;position:relative;z-index:2">${esc(S.profile.name)}'s week</div>
      <div style="font-size:13px;color:#D6EEF7;margin-top:4px;line-height:1.5;position:relative;z-index:2">${verdict}</div>
      <div class="recapgrid">
        <div class="rcell"><div class="rv">${w.kept}</div><div class="rl">Habits kept</div></div>
        <div class="rcell"><div class="rv">${w.ac}</div><div class="rl">All-clear days</div></div>
        <div class="rcell"><div class="rv">${S.profile.streak}</div><div class="rl">Streak now</div></div>
        <div class="rcell"><div class="rv">${money(w.coins)}</div><div class="rl">Coins earned</div></div>
      </div>
      <div class="recappet">
        <div class="fit" style="height:60px;flex:none">${avatarArt()}</div>
        ${S.pet.hatchState==='hatched'?`

          <div class="rprow"><span class="rpk">Health</span>
            <span class="rpbar"><i style="width:${S.pet.health}%"></i></span>

          <div class="rprow"><span class="rpk">Stage</span>

            <span class="rppips wide">${Array.from({length:3},(_,i)=>`<i class="${i<S.pet.hatchProgress?'on':''}"></i>`).join('')}</span>
            <span class="rpv">${S.pet.hatchProgress}<small>/3</small></span></div>

      foot:(bestDay&&bestDay.r.done)?`<b>${WD[dow(bestDay.k)]}</b> was your strongest day at ${bestDay.r.done} of ${bestDay.r.due}.`:'Nothing kept yet this week. There is still time.'})}

    ${panel({ic:'note',title:'Habit by habit',
      body:perHabit.length?perHabit.map(x=>`<div class="hstack">

        </div>
        <span class="hst"><span class="hsf ${x.pct>=80?'g':x.pct<50?'o':''}" style="width:${x.n?x.pct:0}%"></span></span>

    ${panel({ic:'sprout',title:'What grew this week',

        ${badgesThisWeek.length?badgesThisWeek.map(a=>`<div class="tlrow on"><div class="tlt">Badge: ${a.name}</div><div class="tld">${a.desc} · ${prettyDate(S.achLog[a.id])}</div></div>`).join(''):''}

      </div>`,
      foot:`Garden is <b>${gardenPct()}%</b> grown, ${grown.length} of ${GARDEN.length} plots.`})}

    ${S.profile.premium?'':`<div class="callout warn">${ic('crown',14)}<span>HabitHatch+ exports this as an image you can post. The numbers are yours either way.</span></div>`}

function copyRecap(){
  const w=weekAgg(0);
  const txt=`HabitHatch, week of ${prettyDate(w.ws)}\n${w.kept} habits kept (${w.pct}%) · ${w.ac} all-clear days · ${S.profile.streak} day streak\n${money(w.coins)} coins earned. ${S.pet.name} is stage ${petStage()} of 5.`;
  if(navigator.clipboard) navigator.clipboard.writeText(txt).catch(()=>{});
  toast('Recap copied to your clipboard');
}
function shareRecap(){
  if(!S.profile.premium){
    openDialog(`<div class="grip"></div>
      <div style="color:var(--yellow-2);display:flex;justify-content:center">${ic('crown',44)}</div>
      <h3>Share as an image</h3>
      <p class="d-sub">Card export is a HabitHatch+ extra. You can always copy the text version for free.</p>
      <div class="d-actions"><button class="btn ghost block" onclick="closeDialog();copyRecap()">Copy text</button>
      <button class="btn block" onclick="closeDialog();openPremium()">See HabitHatch+</button></div>`);
    return;
  }
  toast('Recap image saved to your device');
}

/* ============================================================
   DIALOG / TOAST / CONFETTI / REWARD
   ============================================================ */
function openDialog(html){
  const host=$('dialogHost');
  host.innerHTML=`<div class="scrim" onclick="if(event.target===this)closeDialog()"><div class="dialog">${html}</div></div>`;
}
function closeDialog(){
  pendingBuy=null;
  const sc=$('dialogHost').querySelector('.scrim:not(.closing)');
  if(!sc) return;
  sc.classList.add('closing');
  setTimeout(()=>{ if(sc.parentNode) sc.remove(); },250);
}
let toastT=null;
function toast(msg,img){
  const t=$('toast');
  t.innerHTML=(img?`<img src="${img}">`:'')+`<span>${msg}</span>`;
  t.classList.toggle('high', !!document.querySelector('.scrim:not(.closing)') || rewardOpen());
  t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400);
}
function confetti(){
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const host=$('confetti');
  const colors=['#E28A4B','#FFDA7C','#0C4C60','#1E7F91','#E68FB0','#12667F','#A7C34F'];
  for(let i=0;i<70;i++){
    const c=document.createElement('div'); c.className='conf';
    c.style.left=Math.random()*100+'%';
    c.style.background=colors[i%colors.length];
    c.style.animationDuration=(1.6+Math.random()*1.4)+'s';
    c.style.animationDelay=(Math.random()*.4)+'s';
    c.style.width=(6+Math.random()*6)+'px';
    c.style.height=(10+Math.random()*8)+'px';
    host.appendChild(c);
    setTimeout(()=>c.remove(),3400);
  }
}
function rewardOpen(){ return $('reward').classList.contains('show'); }
function showReward(o){
  const r=$('reward');
  r.innerHTML=`<div class="rewardcard">
    <div class="burst">${o.icon||ic('trophy',52)}</div>
    ${o.stars?`<div class="startrow" style="justify-content:center;margin:4px 0 2px">${Array.from({length:o.stars},()=>`<span style="display:inline-flex;width:20px;height:20px">${ART['star'+o.stars]}</span>`).join('')}</div>`:''}
    <h2>${o.title}</h2>
    <p>${o.sub||''}</p>
    ${(o.coins!=null||o.right)?`<div class="rewardstats">
      ${o.coins!=null?`<div class="rs"><div class="rv"><img src="${ASSETS.coin}">+${money(o.coins)}</div><div class="rl">Bonus coins</div></div>`:''}
      ${o.right?`<div class="rs"><div class="rv">${o.right.v}</div><div class="rl">${o.right.l}</div></div>`:''}
    </div>`:''}
    ${o.note?`<div class="rewardbonus ${o.coins!=null?'':'muted-bonus'}">${o.note}</div>`:''}
    ${o.goal?`<div class="rewardgoal">${o.goal}</div>`:''}
    <button class="btn block" style="margin-top:16px" onclick="closeReward()">Continue</button>
  </div>`;
  r.classList.add('show');
  confetti();
}
function closeReward(){
  const r=$('reward');
  r.classList.add('fade-out');
  setTimeout(()=>{ r.classList.remove('show','fade-out'); r.innerHTML=''; renderAll();
    if(achQueue.length) setTimeout(drainAch,260);
  },200);
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  const saved=load();
  if(saved){
    S=saved;
    applyTheme();
    // forward-compat: fill any key a previous save predates
    const base=blankState();
    Object.keys(base).forEach(k=>{ if(S[k]===undefined) S[k]=base[k]; });
    Object.keys(base.profile).forEach(k=>{ if(S.profile[k]===undefined) S.profile[k]=base.profile[k]; });
    Object.keys(base.stats).forEach(k=>{ if(S.stats[k]===undefined) S.stats[k]=base.stats[k]; });
    const moved=rollover();
    show('main'); switchTab(S.tab||'today');
    checkAch(true);
    if(moved>0) setTimeout(()=>{
      if(S.frozeYesterday){ delete S.frozeYesterday; save();
        toast('A Streak Freeze saved your streak. Welcome back.'); }
      else if(S.profile.streak===0) toast('New day, clean slate. Nothing was lost.');
      else toast(`Day ${S.profile.streak} of your streak. Let's keep it.`);
    },700);
    if(S.pet.hatchState!=='hatched' && S.pet.hatchProgress>=3 && !S.pet.seenHatch) setTimeout(startHatch,900);
  }else{
    setTimeout(()=>{ show('onboarding'); renderOnboarding(); }, 2500);
  }
}
/* First run seeds the living demo save so the app opens mid-journey. */
(function init(){
  if(!load()){
    S=freshState(true);
    applyTheme();
    save();
    setTimeout(()=>{
      show('main'); switchTab('today'); checkAch(true);
      setTimeout(()=>toast(`${S.pet.name} saved up some coins while you were away`, ASSETS.coin),900);
    },2500);
  }else{
    boot();
  }
})();
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(document.querySelector('#dialogHost .scrim')) closeDialog();
    else if(rewardOpen()) closeReward();
  }
});
</script>
